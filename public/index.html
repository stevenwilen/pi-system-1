<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#16130F" />
    <title>Personal Planning System</title>

    <link rel="manifest" href="/manifest.json" />

    <!-- iOS ignores the manifest for installation, so these carry the same
         information again. apple-touch-icon is the home screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      /* Dusk. Built for a phone in a dark room at the end of the day, so the
         whole surface sits close together in value and only the two things
         you can act on carry any saturation. */
      :root {
        --bg: #16130f;        /* warm near-black, never blue-black */
        --surface: #211d18;   /* cards and rows */
        --recessed: #1c1913;  /* set into the page, not raised off it */
        --line: #2c2721;      /* hairlines */

        --text: #ede7de;
        --muted: #8b8177;
        --dim: #6b6459;       /* disabled, completed, spent */

        /* Amber means actionable. It appears on the steppers and on Confirm
           and nowhere else, so anything glowing is a thing you can press. */
        --amber: #e0a458;
        --warn: #c4694a;      /* a miss, or a collision */

        --pinned-line: #3a332a;
        --radius: 10px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 ui-rounded, "SF Pro Rounded", -apple-system,
          BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Roboto,
          system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overscroll-behavior: none;
        touch-action: manipulation;
      }

      header {
        flex: none;
        padding: 14px 18px 10px;
        padding-top: max(14px, env(safe-area-inset-top));
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--muted);
      }

      main {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 2px 14px 32px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      /* --- sections --- */

      .group {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .group-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 2px 2px;
      }

      .group-head h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* Tight horizontally, generous vertically: the eye runs down a list at
         night, and side padding only narrows the text. */
      .card {
        background: var(--surface);
        border-radius: var(--radius);
        padding: 14px 13px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .none {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.45;
      }

      /* --- buttons --- */

      .linkbtn {
        border: 0;
        background: none;
        padding: 0;
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
      }

      .linkbtn:active {
        color: var(--text);
      }

      .linkbtn.danger {
        color: var(--warn);
      }

      /* Quiet by design. Adding something is not the point of the screen. */
      .addbtn {
        margin-left: auto;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: 0.03em;
        padding: 3px 11px;
        cursor: pointer;
      }

      .addbtn:active {
        background: var(--surface);
        color: var(--text);
      }

      /* Used inside forms. Not amber: saving a row is not the commitment the
         amber is reserved for. */
      .primary {
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--recessed);
        color: var(--text);
        font: inherit;
        font-weight: 600;
        padding: 10px 16px;
        cursor: pointer;
      }

      .primary:active {
        background: var(--surface);
      }

      .primary:disabled {
        color: var(--dim);
        cursor: default;
      }

      /* --- stale rows --- */

      /* Square. A single-sided border against a rounded corner leaves a wedge
         of background showing where the two curves fail to meet. */
      .item {
        background: var(--surface);
        border-radius: 0;
        border-left: 3px solid var(--line);
        padding: 13px 13px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      #stale,
      #paused {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .item-top {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .item-title {
        flex: 1;
        min-width: 0;
        font-size: 14.5px;
        font-weight: 500;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .item-title.pullable {
        cursor: pointer;
      }

      .item-title.pullable:active {
        color: var(--amber);
      }

      .days {
        flex: none;
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        white-space: nowrap;
        padding-top: 2px;
      }

      .item-meta {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
      }

      .why {
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      /* The type is a label, not a badge. No fill, no colour of its own. */
      .tag {
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--dim);
      }

      .actions {
        margin-left: auto;
        display: flex;
        gap: 14px;
      }

      .item.paused {
        background: none;
        border-left-color: var(--line);
      }

      .item.paused .item-title {
        color: var(--dim);
      }

      /* --- the builder --- */

      #builder {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .block {
        display: flex;
        align-items: center;
        gap: 11px;
        background: var(--surface);
        border-radius: var(--radius);
        padding: 11px 12px;
      }

      /* Recessed, and outlined rather than filled. A calendar event is a wall
         the day has to fit around, not a feature of the plan. */
      .block.pinned {
        background: var(--recessed);
        border: 1px solid var(--pinned-line);
        padding: 10px 11px;
      }

      .block.pinned .block-title {
        color: var(--muted);
      }

      .handle {
        flex: none;
        width: 18px;
        text-align: center;
        color: var(--dim);
        cursor: grab;
        touch-action: none;
        user-select: none;
        font-size: 14px;
      }

      .block.pinned .handle {
        cursor: default;
      }

      .block-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .block-title {
        font-size: 14px;
        font-weight: 500;
        overflow-wrap: anywhere;
      }

      .block-when {
        font-size: 11.5px;
        color: var(--dim);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.01em;
      }

      /* --- steppers: actionable, so amber --- */

      .stepper {
        flex: none;
        display: flex;
        align-items: center;
        gap: 3px;
      }

      .stepper button {
        width: 30px;
        height: 30px;
        border: 1px solid rgba(224, 164, 88, 0.28);
        border-radius: 8px;
        background: none;
        color: var(--amber);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
      }

      .stepper button:active {
        background: rgba(224, 164, 88, 0.12);
      }

      .stepper button:disabled {
        border-color: var(--line);
        color: var(--dim);
        cursor: default;
      }

      .stepper span {
        min-width: 50px;
        text-align: center;
        font-size: 11.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }

      .drop {
        border: 1px dashed var(--pinned-line);
        border-radius: var(--radius);
        height: 44px;
      }

      .block.dragging {
        opacity: 0.35;
      }

      /* Shown, never resolved. */
      .clash {
        font-size: 12px;
        font-weight: 500;
        color: var(--warn);
        padding: 3px 13px 5px;
        line-height: 1.4;
      }

      /* --- the end of the day --- */

      #ends {
        gap: 0;
        padding: 0;
      }

      .ends-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 12.5px;
        color: var(--muted);
        padding: 14px 14px 13px;
      }

      .ends-row strong {
        font-size: 19px;
        font-weight: 600;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.01em;
      }

      .ends-row.late strong {
        color: var(--warn);
      }

      /* The hairline is the whole separation. The time is a readout, Confirm
         is a commitment, and they should not read as one control. */
      #ends .primary {
        border: 0;
        border-top: 1px solid var(--line);
        border-radius: 0 0 var(--radius) var(--radius);
        background: none;
        color: var(--amber);
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 14px;
      }

      #ends .primary:active {
        background: rgba(224, 164, 88, 0.1);
      }

      #ends .primary:disabled {
        color: var(--dim);
        background: none;
      }

      /* --- forms --- */

      form {
        display: flex;
        flex-direction: column;
        gap: 11px;
      }

      .seg {
        display: flex;
        gap: 3px;
        background: var(--recessed);
        border-radius: 9px;
        padding: 3px;
      }

      .seg button {
        flex: 1;
        border: 0;
        border-radius: 7px;
        background: none;
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        padding: 7px 0;
        cursor: pointer;
      }

      .seg button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--text);
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      input,
      select,
      textarea {
        font: inherit;
        font-size: 15px;
        font-weight: 400;
        letter-spacing: normal;
        text-transform: none;
        color: var(--text);
        background: var(--recessed);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 10px 11px;
        width: 100%;
      }

      textarea {
        resize: vertical;
        min-height: 62px;
        line-height: 1.45;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: 1px solid var(--amber);
        outline-offset: -1px;
      }

      input::placeholder {
        color: var(--dim);
      }

      .row {
        display: flex;
        gap: 11px;
        align-items: center;
      }

      .row .grow {
        flex: 1;
      }

      .err {
        font-size: 12.5px;
        color: var(--warn);
        line-height: 1.4;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      Planner
    </header>

    <main>
      <div class="group">
        <div class="group-head"><h2>Review</h2></div>
        <div class="card">
          <span class="none">Yesterday's blocks, each with a one-tap "didn't happen". Not built.</span>
        </div>
      </div>

      <div class="group">
        <div class="group-head">
          <h2>Stale</h2>
          <button class="addbtn" id="add-toggle" type="button">+ Add</button>
        </div>

        <div class="card hidden" id="add-card">
          <form id="add-form">
            <div class="seg" id="type-seg" role="group" aria-label="Type">
              <button type="button" data-type="habit" aria-pressed="false">Habit</button>
              <button type="button" data-type="project" aria-pressed="false">Project</button>
              <button type="button" data-type="task" aria-pressed="true">Task</button>
            </div>

            <label>
              Title
              <input id="f-title" type="text" autocomplete="off" />
            </label>

            <label class="hidden" id="f-frequency-wrap">
              Intended frequency
              <select id="f-frequency">
                <option value="daily">daily</option>
                <option value="few times a week">few times a week</option>
                <option value="weekly">weekly</option>
                <option value="monthly">monthly</option>
              </select>
            </label>

            <label class="hidden" id="f-why-wrap">
              Why this matters
              <textarea id="f-why"></textarea>
            </label>

            <label class="hidden" id="f-priority-wrap">
              Priority
              <input id="f-priority" type="number" min="1" step="1" inputmode="numeric" />
            </label>

            <div class="err hidden" id="f-error"></div>

            <div class="row">
              <button class="primary grow" type="submit" id="f-save">Save</button>
              <button class="linkbtn" type="button" id="f-cancel">Cancel</button>
            </div>
          </form>
        </div>

        <div id="stale"></div>
      </div>

      <div class="group hidden" id="paused-group">
        <div class="group-head"><h2>Paused</h2></div>
        <div id="paused"></div>
      </div>

      <div class="group">
        <div class="group-head">
          <h2>Tomorrow</h2>
          <span class="none" id="plan-date"></span>
          <button class="addbtn" id="block-toggle" type="button">+ Block</button>
        </div>

        <div class="card hidden" id="block-card">
          <form id="block-form">
            <label>
              What is it
              <input id="b-title" type="text" autocomplete="off" placeholder="Lunch, rest, drive" />
            </label>
            <div class="row">
              <button class="primary grow" type="submit">Add block</button>
              <button class="linkbtn" type="button" id="b-cancel">Cancel</button>
            </div>
          </form>
        </div>

        <div class="card hidden" id="all-day"></div>

        <div id="builder"></div>

        <div class="card" id="ends">
          <div class="ends-row">
            <span>Day ends</span>
            <strong id="end-time">not yet</strong>
          </div>
          <button class="primary" id="confirm" type="button" disabled>Confirm</button>
        </div>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const stale = $('stale');
      const paused = $('paused');

      let type = 'task';

      async function api(url, options) {
        const res = await fetch(url, options);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `request failed (${res.status})`);
        return data;
      }

      // "today", "1 day", "11 days". The unit is spelled out rather than
      // abbreviated to "11d" because this number is the whole point of the
      // panel and should read as a sentence, not a badge.
      function ageLabel(days) {
        if (days <= 0) return 'today';
        return `${days} day${days === 1 ? '' : 's'}`;
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      // Staleness as temperature. The edge of each row is coloured by where it
      // sits in the range currently on screen, so the list reads as a gradient
      // from warm at the bottom to cold at the top rather than as a set of
      // categories. Relative, not absolute: eleven days means something
      // different on a list where the worst is twelve than on one where the
      // worst is ninety.
      const FRESH = [0x7d, 0x8b, 0x6a];
      const MIDDLE = [0x8a, 0x9a, 0x9e];
      const COLDEST = [0x6b, 0x93, 0xb8];

      const hex = (rgb) =>
        '#' + rgb.map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');

      const mix = (from, to, t) => from.map((v, i) => v + (to[i] - v) * t);

      function temperature(days, min, max) {
        if (!(max > min)) return hex(MIDDLE);
        const t = (days - min) / (max - min);
        return t < 0.5
          ? hex(mix(FRESH, MIDDLE, t * 2))
          : hex(mix(MIDDLE, COLDEST, (t - 0.5) * 2));
      }

      function itemCard(item, range) {
        const card = el('div', 'card item' + (item.paused ? ' paused' : ''));

        // Paused rows keep the neutral hairline. A pause is not a temperature.
        if (range && !item.paused) {
          card.style.borderLeftColor = temperature(item.days, range.min, range.max);
        }

        const top = el('div', 'item-top');
        const title = el('div', 'item-title', item.title);
        // Tapping the title is how something gets into tomorrow. Paused items
        // are not offered: the person has said not now, and the panel should
        // not quietly keep suggesting it.
        if (!item.paused) {
          title.classList.add('pullable');
          title.onclick = () => {
            addBlock({ title: item.title, entryId: item.id });
            $('builder').scrollIntoView({ behavior: 'smooth', block: 'center' });
          };
        }
        top.append(title);
        // Never-scheduled items count from when they were added, so the label
        // says which clock is running rather than implying a plan existed.
        const suffix = item.last_scheduled ? ' since scheduled' : ' since added';
        top.append(el('div', 'days', ageLabel(item.days) + suffix));
        card.append(top);

        if (item.why) card.append(el('div', 'why', item.why));

        const meta = el('div', 'item-meta');
        meta.append(el('span', 'tag ' + item.type, item.type));
        if (item.frequency) meta.append(el('span', 'none', item.frequency));
        if (item.priority) meta.append(el('span', 'none', 'priority ' + item.priority));

        const actions = el('div', 'actions');

        const pause = el('button', 'linkbtn', item.paused ? 'Resume' : 'Not now');
        pause.type = 'button';
        pause.onclick = () => act(`/entries/${item.id}/pause`, { paused: !item.paused });
        actions.append(pause);

        const del = el('button', 'linkbtn danger', 'Delete');
        del.type = 'button';
        del.onclick = () => {
          // Soft delete, but it cannot be undone from the app, so it asks.
          if (confirm(`Delete "${item.title}"?`)) act(`/entries/${item.id}/delete`, {});
        };
        actions.append(del);

        meta.append(actions);
        card.append(meta);
        return card;
      }

      async function act(url, body) {
        try {
          await api(url, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(body),
          });
          await load();
        } catch (err) {
          alert(err.message);
        }
      }

      async function load() {
        let data;
        try {
          data = await api('/entries');
        } catch (err) {
          stale.replaceChildren(el('div', 'card', err.message));
          return;
        }

        stale.replaceChildren();
        if (!data.items.length) {
          const empty = el('div', 'card');
          empty.append(el('span', 'none', 'Nothing here yet. Add a habit, project or task.'));
          stale.append(empty);
        } else {
          const ages = data.items.map((i) => i.days);
          const range = { min: Math.min(...ages), max: Math.max(...ages) };
          for (const item of data.items) stale.append(itemCard(item, range));
        }

        paused.replaceChildren();
        $('paused-group').classList.toggle('hidden', !data.paused.length);
        for (const item of data.paused) paused.append(itemCard(item));

        // The builder plans tomorrow, and the first block starts at the wake
        // time unless it is moved.
        const [wh, wm] = String(data.wake_time).split(':').map(Number);
        wakeMinutes = wh * 60 + wm;

        if (planDate === null) {
          planDate = nextDay(data.today);
          $('plan-date').textContent = new Date(`${planDate}T12:00:00Z`)
            .toLocaleDateString('en-GB', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'short' });
          await openDay(planDate);
        } else {
          renderBuilder();
        }
      }

      // --- the add form ---

      function setType(next) {
        type = next;
        for (const b of $('type-seg').children) {
          b.setAttribute('aria-pressed', String(b.dataset.type === next));
        }
        $('f-frequency-wrap').classList.toggle('hidden', next !== 'habit');
        $('f-why-wrap').classList.toggle('hidden', next !== 'project');
        $('f-priority-wrap').classList.toggle('hidden', next !== 'project');
      }

      for (const b of $('type-seg').children) {
        b.onclick = () => setType(b.dataset.type);
      }

      function resetForm() {
        $('f-title').value = '';
        $('f-why').value = '';
        $('f-priority').value = '';
        $('f-frequency').value = 'daily';
        $('f-error').classList.add('hidden');
        setType('task');
      }

      $('add-toggle').onclick = () => {
        const card = $('add-card');
        const opening = card.classList.contains('hidden');
        card.classList.toggle('hidden', !opening);
        if (opening) {
          resetForm();
          $('f-title').focus();
        }
      };

      $('f-cancel').onclick = () => $('add-card').classList.add('hidden');

      $('add-form').onsubmit = async (event) => {
        event.preventDefault();
        const error = $('f-error');
        error.classList.add('hidden');
        $('f-save').disabled = true;

        try {
          await api('/entries', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              type,
              title: $('f-title').value,
              frequency: $('f-frequency').value,
              why: $('f-why').value,
              priority: $('f-priority').value,
            }),
          });
          $('add-card').classList.add('hidden');
          await load();
        } catch (err) {
          error.textContent = err.message;
          error.classList.remove('hidden');
        } finally {
          $('f-save').disabled = false;
        }
      };

      // --- the builder ------------------------------------------------------

      const STEP = 30; // minutes. The only unit the builder speaks.
      const MIN_DURATION = 30;
      const MAX_DURATION = 8 * 60;

      let blocks = [];
      let wakeMinutes = 7 * 60;
      let planDate = null;
      // Whether what is on screen matches what is saved. Any edit clears it,
      // so the button always says whether there is unsaved work.
      let saved = false;

      function refreshConfirm() {
        const button = $('confirm');
        button.textContent = saved ? 'Confirmed' : 'Confirm';
        button.disabled = saved || !blocks.length;
      }

      function setSaved(next) {
        saved = next;
        refreshConfirm();
      }

      // Every edit goes through here, so there is one place that knows the
      // day on screen no longer matches the day in the database.
      function changed() {
        saved = false;
        renderBuilder();
      }

      const clock = (mins) => {
        const m = ((Math.round(mins) % 1440) + 1440) % 1440;
        return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
      };

      function span(mins) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        if (!h) return `${m}m`;
        return m ? `${h}h ${m}m` : `${h}h`;
      }

      /**
       * Walk the list once and give every block a start time.
       *
       * Unpinned blocks flow: each begins where the last one ended. Pinned
       * blocks hold the start they came with and never move, so the cursor
       * jumps to them. When the cursor has already run past a pinned block the
       * overlap is recorded on the block and shown. It is never resolved:
       * nothing is shortened, nothing is pushed, because the person is the one
       * who decides what gives.
       */
      function layout() {
        let cursor = wakeMinutes;

        for (const b of blocks) {
          if (b.pinned) {
            b.clash = Math.max(0, cursor - b.start);
            // max, not the pinned end alone. When the flow has already run
            // past this block the cursor must not travel backwards, or the
            // next block would be placed inside the one that overran.
            cursor = Math.max(cursor, b.start + b.duration);
          } else {
            b.clash = 0;
            b.start = cursor;
            cursor += b.duration;
          }
        }
        return cursor;
      }

      /**
       * Where a new block of this length should go.
       *
       * The first gap it fits in, in clock order, otherwise the end. A gap is
       * the free time between where the flow has reached and the start of the
       * next pinned block, so filling one moves nothing: everything before it
       * is untouched, the pinned block keeps its time, and everything after
       * still flows from that pinned block's end.
       *
       * This is arithmetic, not judgment. It asks whether a duration fits in a
       * window, never whether something deserves the morning. Appending after
       * an early appointment would be wrong on nearly every day that has one.
       */
      function insertIndexFor(duration) {
        let cursor = wakeMinutes;

        for (let i = 0; i < blocks.length; i++) {
          const b = blocks[i];
          if (!b.pinned) {
            cursor += b.duration;
            continue;
          }
          if (b.start - cursor >= duration) return i;
          cursor = Math.max(cursor, b.start + b.duration);
        }
        return blocks.length;
      }

      function blockRow(b, index) {
        const row = el('div', 'block' + (b.pinned ? ' pinned' : ''));
        row.dataset.index = String(index);

        const handle = el('div', 'handle', b.pinned ? '📌' : '⠿');
        if (!b.pinned) handle.onpointerdown = (e) => startDrag(e, index);
        row.append(handle);

        const body = el('div', 'block-body');
        body.append(el('div', 'block-title', b.title));
        body.append(
          el('div', 'block-when', `${clock(b.start)} to ${clock(b.start + b.duration)}`)
        );
        row.append(body);

        if (b.pinned) {
          row.append(el('div', 'block-when', span(b.duration)));
        } else {
          const stepper = el('div', 'stepper');

          const minus = el('button', null, '−');
          minus.type = 'button';
          minus.disabled = b.duration <= MIN_DURATION;
          minus.onclick = () => {
            b.duration = Math.max(MIN_DURATION, b.duration - STEP);
            changed();
          };

          const plus = el('button', null, '+');
          plus.type = 'button';
          plus.disabled = b.duration >= MAX_DURATION;
          plus.onclick = () => {
            b.duration = Math.min(MAX_DURATION, b.duration + STEP);
            changed();
          };

          stepper.append(minus, el('span', null, span(b.duration)), plus);
          row.append(stepper);

          const remove = el('button', 'linkbtn', '×');
          remove.type = 'button';
          remove.onclick = () => {
            blocks.splice(index, 1);
            changed();
          };
          row.append(remove);
        }

        return row;
      }

      function renderBuilder() {
        const end = layout();
        const builder = $('builder');
        builder.replaceChildren();

        if (!blocks.length) {
          const empty = el('div', 'card');
          empty.append(
            el('span', 'none', 'Tap something in Stale to put it in tomorrow, or add a block.')
          );
          builder.append(empty);
        }

        blocks.forEach((b, i) => {
          builder.append(blockRow(b, i));
          if (b.clash) {
            builder.append(
              el('div', 'clash', `Overlaps ${b.title} by ${span(b.clash)}. Shorten something above.`)
            );
          }
        });

        refreshConfirm();
        $('end-time').textContent = blocks.length ? clock(end) : 'not yet';
        // Past midnight is the one case the clock cannot show on its own:
        // 00:30 looks earlier than 23:00 rather than later.
        $('ends').querySelector('.ends-row').classList.toggle('late', end >= 1440);
        if (end >= 1440 && blocks.length) {
          $('end-time').textContent = clock(end) + ' next day';
        }
      }

      function addBlock({ title, entryId = null, duration = 60 }) {
        const block = { title, entryId, duration, start: 0, pinned: false, clash: 0 };
        blocks.splice(insertIndexFor(duration), 0, block);
        changed();
      }

      // --- drag to reorder ---
      //
      // Pointer events rather than HTML5 drag and drop, which does not fire on
      // touch. The row being dragged is left in place at reduced opacity and a
      // marker shows where it would land, so the list never reshuffles under
      // the finger while it is still moving.

      let drag = null;

      function startDrag(event, index) {
        if (blocks[index].pinned) return;
        event.preventDefault();

        drag = { from: index, to: index };
        const row = event.currentTarget.parentNode;
        row.classList.add('dragging');
        row.setPointerCapture(event.pointerId);

        const move = (e) => {
          const rows = [...$('builder').querySelectorAll('.block')];
          let to = drag.from;
          for (const r of rows) {
            const box = r.getBoundingClientRect();
            const i = Number(r.dataset.index);
            // Past the midpoint of a row means the dragged block belongs on
            // the far side of it.
            if (e.clientY > box.top + box.height / 2) to = i;
          }
          drag.to = to;
        };

        const end = () => {
          row.releasePointerCapture(event.pointerId);
          row.removeEventListener('pointermove', move);
          row.removeEventListener('pointerup', end);
          row.removeEventListener('pointercancel', end);

          const moved = drag && drag.to !== drag.from;
          if (moved) {
            const [block] = blocks.splice(drag.from, 1);
            blocks.splice(drag.to, 0, block);
          }
          drag = null;
          moved ? changed() : renderBuilder();
        };

        row.addEventListener('pointermove', move);
        row.addEventListener('pointerup', end);
        row.addEventListener('pointercancel', end);
      }

      // --- pinned blocks from the calendar ---

      function nextDay(date) {
        const d = new Date(`${date}T12:00:00Z`);
        d.setUTCDate(d.getUTCDate() + 1);
        return d.toISOString().slice(0, 10);
      }

      // A calendar that cannot be read must never stop planning, so a failure
      // here is an empty day rather than an error.
      async function fetchCalendar(date) {
        try {
          const data = await api(`/calendar/${date}`);
          return { events: data.events || [], allDay: data.all_day || [] };
        } catch {
          return { events: [], allDay: [] };
        }
      }

      // All-day entries are reminders. They are worth seeing while planning and
      // they claim no hours, so they sit above the blocks rather than inside
      // them. An earlier version made each one a 24 hour pinned block, which
      // swallowed the whole day.
      function showAllDay(allDay) {
        const note = $('all-day');
        note.replaceChildren();
        note.classList.toggle('hidden', !allDay.length);
        if (allDay.length) {
          note.append(el('span', 'none', 'All day: ' + allDay.map((a) => a.title).join(', ')));
        }
      }

      async function loadCalendar(date) {
        const { events, allDay } = await fetchCalendar(date);
        showAllDay(allDay);

        // The server returns them already in clock order, so they only need
        // appending. An earlier version sorted the whole list with a
        // comparator that returned 0 for any pinned/unpinned pair, which is
        // not a valid ordering: the result depended on the sort algorithm
        // rather than on the times.
        blocks = blocks.filter((b) => !b.pinned);
        for (const e of events) {
          blocks.push({
            title: e.title,
            entryId: null,
            duration: e.duration_minutes,
            start: e.start_minutes,
            pinned: true,
            clash: 0,
          });
        }
        renderBuilder();
      }

      /**
       * Open the day.
       *
       * A confirmed plan wins over the calendar: it already contains whatever
       * pinned blocks existed when it was built, and reseeding from the feed
       * would duplicate them.
       */
      async function openDay(date) {
        // Named `existing`, not `saved`: `saved` is the module-level flag for
        // whether the screen matches the database, and shadowing it here would
        // make every assignment inside this function silently local.
        let existing = { plan: null, blocks: [] };
        try {
          existing = await api(`/plan/${date}`);
        } catch {
          // No saved plan is the normal case, and a failure here should still
          // leave a usable builder.
        }

        if (existing.plan && existing.blocks.length) {
          blocks = existing.blocks.map((b) => ({
            title: b.title,
            entryId: b.entryId,
            duration: b.duration_minutes,
            start: b.start_minutes,
            pinned: b.pinned,
            clash: 0,
          }));
          // The note still comes from the feed: it is not part of the plan
          // because it never occupied any of it.
          showAllDay((await fetchCalendar(date)).allDay);
          renderBuilder();
          setSaved(existing.plan.status === 'confirmed');
          return;
        }

        setSaved(false);
        await loadCalendar(date);
      }

      $('block-toggle').onclick = () => {
        const card = $('block-card');
        const opening = card.classList.contains('hidden');
        card.classList.toggle('hidden', !opening);
        if (opening) {
          $('b-title').value = '';
          $('b-title').focus();
        }
      };

      $('b-cancel').onclick = () => $('block-card').classList.add('hidden');

      $('block-form').onsubmit = (event) => {
        event.preventDefault();
        const title = $('b-title').value.trim();
        if (!title) return;
        addBlock({ title });
        $('block-card').classList.add('hidden');
      };

      $('confirm').onclick = async () => {
        const button = $('confirm');
        button.disabled = true;
        try {
          await api('/plan', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              date: planDate,
              blocks: blocks.map((b) => ({
                title: b.title,
                entryId: b.entryId,
                start_minutes: b.start,
                duration_minutes: b.duration,
                pinned: b.pinned,
              })),
            }),
          });
          setSaved(true);
          // Scheduling something resets its clock, so the panel it came from
          // has to be reread rather than left showing yesterday's numbers.
          await load();
        } catch (err) {
          alert(err.message);
          setSaved(false);
        }
      };

      setType('task');
      load();
    </script>
  </body>
</html>
