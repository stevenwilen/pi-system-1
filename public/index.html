<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#16130F" />
    <title>Planner</title>

    <link rel="manifest" href="/manifest.json" />

    <!-- iOS ignores the manifest for installation, so these carry the same
         information again. apple-touch-icon is the home screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <style>
      /* One screen, read once in the evening.

         The rules the whole page is built on:

         - A row is a row. Yesterday and Things are plain rows with hairline
           dividers between them. Only a builder block is a card, because a
           card says "this is an object you move", and those are the only
           objects here that move.
         - Sections are separated by space, not by borders or boxes. 36px is
           the separator.
         - One label style, everywhere. Actions sit on its baseline and are
           quieter than it, never louder.
         - Two text sizes in a row: 15px title, 12px meta, with real space
           between them.
         - Blue is actionable. It is on the steppers and on Confirm, and
           nowhere else. Nothing decorative is ever blue.
         - The miss colour is for misses and warnings, and nothing else. */
      :root {
        --bg: #16130f;
        --card: #211d18;
        --line: #2c2721;

        --text: #ede7de;
        --muted: #8b8177;
        --faint: #6b6459;

        --accent: #6e8cb8;
        --warn: #c4694a;

        /* The calendar aside. Neutral warm grey: it is reference material,
           so it must read as neither actionable nor wrong. */
        --cal-rule: #4a423a;
        --cal-head: #9a8f80;
        --cal-text: #b0a79a;

        --gap: 36px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }

      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 28px 20px calc(40px + env(safe-area-inset-bottom));
      }

      .hidden {
        display: none !important;
      }

      /* Every time on the page lines up vertically with every other one. */
      .tnum {
        font-variant-numeric: tabular-nums;
      }

      /* --- the one label style ------------------------------------------- */

      .label {
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 14px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
      }

      /* On the label's baseline, and deliberately quieter than it: no
         uppercase, no tracking, no weight. The section is the heading; the
         action is a thing you may do, not a second heading. */
      .label .act {
        letter-spacing: 0;
        text-transform: none;
        font-size: 12px;
        color: var(--muted);
        background: none;
        border: 0;
        padding: 0;
        font-family: inherit;
        cursor: pointer;
      }

      .label .date {
        letter-spacing: 0;
        text-transform: none;
        font-size: 11px;
        color: var(--faint);
      }

      .section {
        margin-bottom: var(--gap);
      }

      /* --- plain rows, hairline dividers ---------------------------------- */

      .row {
        padding: 12px 0;
      }

      .row + .row {
        border-top: 1px solid var(--line);
      }

      .row-top {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .row .title {
        font-size: 15px;
        flex: 1;
        line-height: 1.35;
      }

      /* The meta line: its own line, with real space above it. */
      .row .meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 5px;
        line-height: 1.4;
      }

      .between {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .mark {
        font-size: 14px;
        color: var(--warn);
        letter-spacing: 1px;
      }

      .done {
        color: var(--faint);
        text-decoration: line-through;
      }

      .right {
        font-size: 12px;
        color: var(--faint);
        background: none;
        border: 0;
        font-family: inherit;
        padding: 0;
        white-space: nowrap;
        cursor: pointer;
      }

      .missed {
        font-size: 12px;
        color: var(--warn);
        background: none;
        border: 0;
        font-family: inherit;
        padding: 0;
        white-space: nowrap;
        cursor: pointer;
      }

      .empty {
        font-size: 13px;
        color: var(--faint);
        padding: 2px 0 4px;
      }

      /* The optional reason on a missed block. A bare line, no box: it is a
         note attached to a row, not a field on a form. */
      .reason {
        margin-top: 8px;
        width: 100%;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        padding: 3px 0;
      }
      .reason::placeholder {
        color: var(--faint);
      }
      .reason:focus {
        outline: none;
        border-bottom-color: var(--muted);
      }

      /* The hint that a row has more than one thing you can do to it.
         Faint rather than muted: it sits at the right edge of every row in
         the list, so at muted it would draw a second vertical line of
         emphasis down the page and compete with the titles. Same weight as
         "didn't happen" in Yesterday, which is the other right-edge action. */
      .hint {
        font-size: 13px;
        color: var(--faint);
        background: none;
        border: 0;
        font-family: inherit;
        line-height: 1;
        padding: 0 2px;
        cursor: pointer;
      }

      /* Revealed by the hint. Hidden at rest, so the list reads as a list
         rather than as a menu. */
      .rowacts {
        display: flex;
        gap: 18px;
        margin-top: 9px;
      }
      .rowacts button {
        font-size: 12px;
        color: var(--muted);
        background: none;
        border: 0;
        padding: 0;
        font-family: inherit;
        cursor: pointer;
      }
      .rowacts .danger {
        color: var(--warn);
      }

      /* --- the calendar aside --------------------------------------------- */
      /* A left rule and indented text. Not a card, not blue, not a warning:
         this is what is already true about the day. */

      .cal {
        border-left: 2px solid var(--cal-rule);
        padding: 8px 0 8px 13px;
        margin-bottom: 22px;
      }
      .cal h4 {
        font-size: 12px;
        font-weight: 500;
        color: var(--cal-head);
      }
      .cal p {
        font-size: 13px;
        color: var(--cal-text);
        margin-top: 6px;
        line-height: 1.6;
        white-space: pre-line;
        font-variant-numeric: tabular-nums;
      }
      .cal .failed {
        color: var(--warn);
      }

      /* --- inline control, not a card ------------------------------------- */

      .inline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
      }
      .inline > span {
        font-size: 13px;
        color: var(--muted);
      }

      .stepper {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      /* Blue, because pressing it changes the day. */
      .step {
        color: var(--accent);
        font-size: 18px;
        line-height: 1;
        background: none;
        border: 0;
        font-family: inherit;
        padding: 2px 6px;
        cursor: pointer;
      }
      .step:disabled {
        color: var(--faint);
      }
      .num {
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        min-width: 46px;
        text-align: center;
      }

      /* --- blocks ARE cards ------------------------------------------------ */
      /* Because they are objects you manipulate. Nothing else here is. */

      .block {
        background: var(--card);
        border-radius: 11px;
        padding: 14px 15px;
        margin-bottom: 9px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .block .t {
        font-size: 15px;
      }
      .block .time {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        font-variant-numeric: tabular-nums;
      }
      .dur {
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        min-width: 40px;
        text-align: center;
      }

      /* The removal confirm, in place of the stepper.
         Keep sits where minus was. A block is removed by pressing minus at the
         30-minute floor, so the press that opens this is a press on the left
         of the stepper — and the next one, if the person is going fast, lands
         in the same place. That place has to be the harmless one. */
      .confirming {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .confirming button {
        font-size: 13px;
        background: none;
        border: 0;
        font-family: inherit;
        padding: 2px 0;
        cursor: pointer;
      }
      .confirming .keep {
        color: var(--muted);
      }
      .confirming .remove {
        color: var(--warn);
      }

      .addblock {
        font-size: 12px;
        color: var(--faint);
        padding-top: 8px;
        background: none;
        border: 0;
        font-family: inherit;
        cursor: pointer;
      }

      .ends {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 28px;
        padding-bottom: 20px;
      }
      .ends span {
        font-size: 13px;
        color: var(--muted);
      }
      .ends b {
        font-size: 17px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      /* A day running past midnight is the one thing the end time can be
         wrong about, so it is said in the miss colour. */
      .ends.late b {
        color: var(--warn);
      }

      /* Blue, because it is the one thing on this page that commits. */
      .confirm {
        display: block;
        width: 100%;
        background: var(--accent);
        color: var(--bg);
        text-align: center;
        padding: 14px;
        border-radius: 11px;
        font-size: 14px;
        font-weight: 600;
        border: 0;
        font-family: inherit;
        cursor: pointer;
      }
      .confirm:disabled {
        background: var(--card);
        color: var(--faint);
      }

      /* --- the add sheet --------------------------------------------------- */

      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        z-index: 10;
      }
      .sheet {
        background: var(--bg);
        width: 100%;
        max-width: 480px;
        border-radius: 18px 18px 0 0;
        padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
        max-height: 88vh;
        overflow-y: auto;
      }

      .field {
        margin-bottom: 20px;
      }
      .field > label {
        display: block;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .field input[type="text"],
      .field input[type="date"] {
        width: 100%;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        color: var(--text);
        font: inherit;
        padding: 6px 0;
      }
      .field input:focus {
        outline: none;
        border-bottom-color: var(--muted);
      }

      /* Choices read as text, not as controls. The chosen one is simply the
         one that is not dimmed — no fill and no blue, because picking a type
         is not an action against the day. */
      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .choices button {
        font-size: 13px;
        color: var(--faint);
        background: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 13px;
        font-family: inherit;
        cursor: pointer;
      }
      .choices button[aria-pressed="true"] {
        color: var(--text);
        border-color: var(--muted);
      }

      /* Editing: the type cannot change, so the chooser stops being a chooser
         and becomes a statement of what this row is. The chosen one still
         reads normally; the others go, rather than sitting there greyed and
         inviting a press that will not work. */
      .choices.fixed button[aria-pressed="false"] {
        display: none;
      }
      .choices.fixed button {
        border-color: transparent;
        padding-left: 0;
      }

      .sheet-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 26px;
      }
      .sheet-actions .cancel {
        font-size: 13px;
        color: var(--muted);
        background: none;
        border: 0;
        font-family: inherit;
        cursor: pointer;
      }
      .sheet-actions .save {
        background: var(--accent);
        color: var(--bg);
        border: 0;
        border-radius: 11px;
        padding: 12px 26px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .problem {
        font-size: 12px;
        color: var(--warn);
        margin-top: 14px;
      }
    </style>
  </head>

  <body>
    <main>
      <!-- 1. YESTERDAY ------------------------------------------------------ -->
      <section class="section">
        <div class="label">Yesterday <span class="date" id="review-date"></span></div>
        <div id="review"></div>
      </section>

      <!-- 2. THINGS --------------------------------------------------------- -->
      <section class="section">
        <div class="label">
          Things
          <button type="button" class="act" id="add-open">+ Add</button>
        </div>
        <div id="things"></div>
      </section>

      <!-- 3. TOMORROW ------------------------------------------------------- -->
      <section>
        <div class="label">Tomorrow <span class="date" id="plan-date"></span></div>

        <div class="cal" id="cal">
          <h4>On your calendar</h4>
          <p id="cal-list"></p>
        </div>

        <div class="inline">
          <span>Starts</span>
          <div class="stepper">
            <button type="button" class="step" id="wake-minus">&minus;</button>
            <span class="num" id="wake-time">08:00</span>
            <button type="button" class="step" id="wake-plus">+</button>
          </div>
        </div>

        <div style="height: 14px"></div>

        <div id="builder"></div>

        <button type="button" class="addblock" id="add-block">+ Block</button>

        <div class="ends" id="ends">
          <span>Day ends</span>
          <b class="tnum" id="end-time">—</b>
        </div>

        <button type="button" class="confirm" id="confirm">Confirm</button>
      </section>
    </main>

    <!-- the add sheet ------------------------------------------------------- -->
    <div class="scrim hidden" id="add-scrim">
      <div class="sheet">
        <div class="label" id="sheet-title">Add</div>

        <div class="field">
          <label>Type</label>
          <div class="choices" id="type-seg">
            <button type="button" data-type="habit">habit</button>
            <button type="button" data-type="project">project</button>
            <button type="button" data-type="task">task</button>
          </div>
        </div>

        <div class="field">
          <label for="f-title">Title</label>
          <input type="text" id="f-title" autocomplete="off" />
        </div>

        <div class="field hidden" id="f-freq-field">
          <label>Frequency</label>
          <div class="choices" id="freq-seg"></div>
        </div>

        <div class="field hidden" id="f-due-field">
          <label for="f-due">Due date</label>
          <input type="date" id="f-due" />
        </div>

        <div class="field hidden" id="f-size-field">
          <label>Size</label>
          <div class="choices" id="size-seg"></div>
        </div>

        <div class="problem hidden" id="f-problem"></div>

        <div class="sheet-actions">
          <button type="button" class="cancel" id="add-cancel">Cancel</button>
          <button type="button" class="save" id="add-save">Add</button>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      // The step everything moves in. Half an hour is the smallest unit this
      // system expresses: block durations, the start time, all of it.
      const STEP = 30;

      // The hours a person actually gets up. Outside these the stepper would
      // be being flexible rather than helpful.
      const WAKE_MIN = 4 * 60;
      const WAKE_MAX = 12 * 60;

      const SIZES = ['a day', 'a few days', 'a week', 'a few weeks', 'months'];
      const FREQUENCIES = ['daily', 'few times a week', 'weekly', 'monthly'];

      // A due date belongs to these two. A habit has a cadence instead.
      const DATED = ['project', 'task'];

      const pad = (n) => String(n).padStart(2, '0');

      /** Minutes past midnight as a clock time, wrapping past midnight. */
      const clock = (mins) => `${pad(Math.floor((mins % 1440) / 60))}:${pad(mins % 60)}`;

      /** A duration as a person says it: 30m, 1h, 1h 30m. */
      function span(mins) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        if (!h) return `${m}m`;
        return m ? `${h}h ${m}m` : `${h}h`;
      }

      const toMinutes = (t) => {
        const [h, m] = String(t).split(':').map(Number);
        return h * 60 + m;
      };

      const addDays = (date, n) => {
        const d = new Date(`${date}T12:00:00Z`);
        d.setUTCDate(d.getUTCDate() + n);
        return d.toISOString().slice(0, 10);
      };

      const prettyDate = (date) =>
        new Intl.DateTimeFormat('en-GB', {
          weekday: 'short',
          day: 'numeric',
          month: 'short',
          timeZone: 'UTC',
        }).format(new Date(`${date}T12:00:00Z`));

      // --- state --------------------------------------------------------------

      let things = [];
      let blocks = []; // { title, entryId, duration, start }
      let wake = 8 * 60;
      let planDate = null;
      let saved = false;

      // Index of the block asking whether it should be removed, or null. Only
      // ever one: arming a second question cancels the first, so there is
      // never more than one pending destructive answer on screen.
      let removing = null;

      // Test seam: a suite needs to put the page into the state a saved day
      // leaves it in without driving a real confirm through the network.
      function setSaved(v) {
        saved = v;
        renderConfirm();
      }

      // --- 1. yesterday --------------------------------------------------------

      async function loadReview() {
        let data;
        try {
          data = await (await fetch('/review')).json();
        } catch {
          return;
        }

        $('review-date').textContent = data.date ? prettyDate(data.date) : '';
        const box = $('review');
        box.replaceChildren();

        if (!data.blocks || !data.blocks.length) {
          const none = document.createElement('div');
          none.className = 'empty';
          none.textContent = 'Nothing was planned.';
          box.append(none);
          return;
        }

        for (const b of data.blocks) box.append(reviewRow(b));
      }

      /**
       * One block of yesterday.
       *
       * Assumed done. The only question being asked is whether that is wrong,
       * and it is one tap to say so. Nothing here asks anyone to confirm the
       * ordinary case.
       */
      function reviewRow(b) {
        const row = document.createElement('div');
        row.className = 'row';

        const top = document.createElement('div');
        top.className = 'between';

        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = b.title;

        const action = document.createElement('button');
        action.type = 'button';

        const missed = b.completed === false;
        if (missed) title.classList.add('done');
        action.className = missed ? 'missed' : 'right';
        action.textContent = missed ? 'missed' : "didn't happen";

        top.append(title, action);
        row.append(top);

        // The reason is optional and always has been. Demanding one is how a
        // review stops being done at all.
        const reason = document.createElement('input');
        reason.className = 'reason';
        reason.type = 'text';
        reason.placeholder = 'why, if you want to say';
        reason.value = b.miss_reason || '';
        if (!missed) reason.classList.add('hidden');
        row.append(reason);

        const mark = async (isMissed, why) => {
          try {
            await fetch(`/blocks/${b.id}/miss`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ missed: isMissed, reason: why || '' }),
            });
          } catch {
            // The screen already shows the new state. A failed write is
            // corrected by the next load rather than by an alert in the
            // middle of a review.
          }
        };

        action.onclick = () => {
          const nowMissed = action.textContent !== 'missed';
          title.classList.toggle('done', nowMissed);
          action.className = nowMissed ? 'missed' : 'right';
          action.textContent = nowMissed ? 'missed' : "didn't happen";
          reason.classList.toggle('hidden', !nowMissed);
          if (!nowMissed) reason.value = '';
          mark(nowMissed, reason.value);
        };

        reason.onchange = () => mark(true, reason.value);

        return row;
      }

      // --- 2. things -----------------------------------------------------------

      /** How a deadline reads. */
      function dueText(days) {
        if (days < 0) return `${-days} day${-days === 1 ? '' : 's'} overdue`;
        if (days === 0) return 'due today';
        if (days === 1) return 'due tomorrow';
        return `due in ${days} days`;
      }

      /**
       * The meta line: type, then either the deadline and its size, or how
       * long this has been sitting there.
       *
       * "since scheduled" and "since added" are different claims, and the row
       * says which one it is making. Something never scheduled is counted from
       * the day it was written down, and calling that "since scheduled" would
       * be reporting a scheduling that never happened.
       */
      function metaFor(item) {
        if (item.due) {
          return [item.type, dueText(item.days_until_due), item.size]
            .filter(Boolean)
            .join(' · ');
        }

        const noun = item.last_scheduled ? 'scheduled' : 'added';
        if (item.days === 0) return `${item.type} · ${noun} today`;
        return `${item.type} · ${item.days} day${item.days === 1 ? '' : 's'} since ${noun}`;
      }

      async function load() {
        let data;
        try {
          data = await (await fetch('/entries')).json();
        } catch {
          return;
        }

        things = data.items || [];

        // The day being built is tomorrow, reckoned where the person lives.
        if (!planDate) {
          planDate = addDays(data.today, 1);
          $('plan-date').textContent = prettyDate(planDate);
          wake = toMinutes(data.wake_time || '08:00');
          await loadCalendar(planDate);
          await loadPlan(planDate);
        }

        renderThings();
        renderWake();
      }

      function renderThings() {
        const box = $('things');
        box.replaceChildren();

        if (!things.length) {
          const none = document.createElement('div');
          none.className = 'empty';
          none.textContent = 'Nothing here yet.';
          box.append(none);
          return;
        }

        for (const item of things) box.append(thingRow(item));
      }

      /**
       * One thing.
       *
       * Tapping the row puts it in tomorrow, which is what this list is for.
       * Everything else you can do to it sits behind the hint at the right
       * edge, so the resting state of the list is still a list — but the fact
       * that there is more there is visible rather than something you have to
       * already know.
       *
       * This used to be a long press with nothing on screen to suggest it.
       */
      function thingRow(item) {
        const row = document.createElement('div');
        row.className = 'row';
        row.dataset.id = item.id;

        const top = document.createElement('div');
        top.className = 'row-top';

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = item.title;
        top.append(title);

        // '!!!', '!!' or '!'. Computed on the server and arithmetic all the
        // way down: the days the size needs against the days that are left.
        if (item.mark) {
          const mark = document.createElement('div');
          mark.className = 'mark';
          mark.textContent = item.mark;
          top.append(mark);
        }

        const hint = document.createElement('button');
        hint.type = 'button';
        hint.className = 'hint';
        hint.textContent = '···';
        hint.setAttribute('aria-label', `More for ${item.title}`);
        top.append(hint);

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = metaFor(item);

        row.append(top, meta);

        const acts = document.createElement('div');
        acts.className = 'rowacts hidden';

        // Tasks only. A habit recurring is the point of a habit, and a project
        // is not finished by one session of work on it.
        if (item.type === 'task') {
          const done = document.createElement('button');
          done.type = 'button';
          done.textContent = 'Done';
          done.onclick = (e) => {
            e.stopPropagation();
            finish(item.id);
          };
          acts.append(done);
        }

        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = 'Edit';
        edit.onclick = (e) => {
          e.stopPropagation();
          acts.classList.add('hidden');
          openSheet(item);
        };
        acts.append(edit);

        // Last, and the only one in the miss colour. Delete sitting between
        // two ordinary actions is a misclick waiting to happen.
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'danger';
        del.textContent = 'Delete';
        del.onclick = (e) => {
          e.stopPropagation();
          if (confirm(`Delete "${item.title}"?`)) remove(item.id);
        };
        acts.append(del);
        row.append(acts);

        hint.onclick = (e) => {
          // Without this the row's own handler fires straight afterwards and
          // schedules the thing the person was only asking about.
          e.stopPropagation();
          acts.classList.toggle('hidden');
        };

        row.onclick = () => {
          // An open menu closes rather than scheduling. Tapping away from a
          // menu you opened should undo the opening, not commit to something.
          if (!acts.classList.contains('hidden')) {
            acts.classList.add('hidden');
            return;
          }
          addBlock({ title: item.title, entryId: item.id, duration: 60 });
        };

        return row;
      }

      async function finish(id) {
        try {
          await fetch(`/entries/${id}/done`, { method: 'POST' });
        } catch {
          return;
        }
        things = things.filter((t) => t.id !== id);
        renderThings();
      }

      async function remove(id) {
        try {
          await fetch(`/entries/${id}/delete`, { method: 'POST' });
        } catch {
          return;
        }
        things = things.filter((t) => t.id !== id);
        renderThings();
      }

      // --- 3. tomorrow ---------------------------------------------------------

      /**
       * The calendar aside.
       *
       * Read, shown, forgotten. Nothing here is placed into the day and
       * nothing about it is stored: it is what is already true about tomorrow,
       * and what to do about it is the person's decision to make.
       */
      async function loadCalendar(date) {
        let data;
        try {
          data = await (await fetch(`/calendar/${date}`)).json();
        } catch {
          return;
        }

        const lines = (data.items || []).map((e) =>
          e.start_minutes === null ? e.title : `${e.title}, ${clock(e.start_minutes)}`
        );

        const box = $('cal-list');
        box.replaceChildren();
        box.textContent = lines.length ? lines.join('\n') : 'Nothing on it.';

        // A feed that is down and a quiet Tuesday produce the same empty list,
        // so a failure is said out loud rather than left to look like a free
        // day.
        for (const f of data.failed || []) {
          const warn = document.createElement('span');
          warn.className = 'failed';
          warn.textContent = `\n${f.label} could not be read.`;
          box.append(warn);
        }
      }

      /** A day already confirmed, so it survives a page load. */
      async function loadPlan(date) {
        let data;
        try {
          data = await (await fetch(`/plan/${date}`)).json();
        } catch {
          return renderBuilder();
        }
        if (!data.plan) return renderBuilder();

        wake = data.plan.wake_minutes;
        blocks = (data.blocks || []).map((b) => ({
          title: b.title,
          entryId: b.entryId,
          duration: b.duration_minutes,
        }));
        removing = null;
        saved = data.plan.status === 'confirmed';
        renderWake();
        renderBuilder();
      }

      /**
       * Blocks flow in sequence from the start time.
       *
       * Nothing is pinned and nothing is placed automatically, so a block
       * begins when the one above it ends and that is the whole rule. Changing
       * one duration shifts everything below it, which is what the steppers
       * are for.
       */
      function reflow() {
        let cursor = wake;
        for (const b of blocks) {
          b.start = cursor;
          cursor += b.duration;
        }
        return cursor;
      }

      // Any other action answers the pending question by dropping it. A
      // confirm left standing while the day is edited around it would be a
      // Remove button pointing at a block that has since moved.
      function addBlock({ title, entryId = null, duration = 60 }) {
        blocks.push({ title, entryId, duration });
        removing = null;
        saved = false;
        renderBuilder();
      }

      function setWake(mins) {
        wake = mins;
        removing = null;
        renderWake();
        renderBuilder();
      }

      function renderWake() {
        $('wake-time').textContent = clock(wake);
        $('wake-minus').disabled = wake <= WAKE_MIN;
        $('wake-plus').disabled = wake >= WAKE_MAX;
      }

      // A day saved off the half hour — from a build when the step was fifteen
      // minutes — is corrected by one press rather than kept off the grid for
      // ever.
      const stepUp = (v) => Math.min(WAKE_MAX, Math.floor(v / STEP) * STEP + STEP);
      const stepDown = (v) => Math.max(WAKE_MIN, Math.ceil(v / STEP) * STEP - STEP);

      $('wake-minus').onclick = () => {
        saved = false;
        setWake(stepDown(wake));
      };
      $('wake-plus').onclick = () => {
        saved = false;
        setWake(stepUp(wake));
      };

      function renderBuilder() {
        const end = reflow();
        const box = $('builder');
        box.replaceChildren();

        for (const [i, b] of blocks.entries()) box.append(blockCard(b, i));

        $('end-time').textContent = !blocks.length
          ? '—'
          : end >= 1440
            ? `${clock(end)} next day`
            : clock(end);
        $('ends').classList.toggle('late', blocks.length > 0 && end >= 1440);

        renderConfirm();
      }

      /**
       * A block: the one kind of object on this page you manipulate, so a card.
       *
       * Removal is the minus stepper carried past its floor. Shrinking a block
       * to nothing and removing it are the same intention, so they are the same
       * control — and the stepper already owns this edge of the card, which is
       * why a block gets no `···` the way a row in Things does.
       *
       * It used to be a long press, with nothing to suggest it.
       */
      function blockCard(b, i) {
        const card = document.createElement('div');
        card.className = 'block';

        const left = document.createElement('div');
        const t = document.createElement('div');
        t.className = 't';
        t.textContent = b.title;
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = `${clock(b.start)} – ${clock(b.start + b.duration)}`;
        left.append(t, time);

        card.append(left, i === removing ? confirmRemove(i) : durationStepper(b, i));
        return card;
      }

      function durationStepper(b, i) {
        const stepper = document.createElement('div');
        stepper.className = 'stepper';

        const minus = document.createElement('button');
        minus.type = 'button';
        minus.className = 'step';
        minus.textContent = '−';
        minus.setAttribute(
          'aria-label',
          b.duration <= STEP ? `Remove ${b.title}` : `Shorten ${b.title}`
        );
        minus.onclick = () => {
          if (b.duration > STEP) {
            b.duration -= STEP;
            removing = null;
            saved = false;
            return renderBuilder();
          }
          // At the floor. One more press is how you say you meant to remove
          // it, and it only arms the question — nothing is lost yet.
          removing = i;
          renderBuilder();
        };

        const dur = document.createElement('div');
        dur.className = 'dur';
        dur.textContent = span(b.duration);

        const plus = document.createElement('button');
        plus.type = 'button';
        plus.className = 'step';
        plus.textContent = '+';
        plus.setAttribute('aria-label', `Lengthen ${b.title}`);
        plus.onclick = () => {
          b.duration += STEP;
          removing = null;
          saved = false;
          renderBuilder();
        };

        stepper.append(minus, dur, plus);
        return stepper;
      }

      /**
       * Keep, then Remove.
       *
       * That order is the whole safety of this. The press that opens this
       * confirm is a press on the left of the stepper, and a second fast press
       * lands in the same place — so the left position has to be the harmless
       * one. Putting Remove there would make a double-tap on minus delete a
       * block silently, which is exactly what the confirm is here to stop.
       */
      function confirmRemove(i) {
        const box = document.createElement('div');
        box.className = 'confirming';

        const keep = document.createElement('button');
        keep.type = 'button';
        keep.className = 'keep';
        keep.textContent = 'Keep';
        keep.onclick = () => {
          removing = null;
          renderBuilder();
        };

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'remove';
        remove.textContent = 'Remove';
        remove.onclick = () => {
          blocks.splice(i, 1);
          removing = null;
          saved = false;
          renderBuilder();
        };

        box.append(keep, remove);
        return box;
      }

      $('add-block').onclick = () => {
        const title = prompt('What is this block?');
        if (title && title.trim()) addBlock({ title: title.trim(), duration: STEP });
      };

      function renderConfirm() {
        const button = $('confirm');
        button.textContent = saved ? 'Confirmed' : 'Confirm';
        button.disabled = saved || !blocks.length;
      }

      $('confirm').onclick = async () => {
        if (!blocks.length) return;
        reflow();

        let res;
        try {
          res = await (
            await fetch('/plan', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                date: planDate,
                wake_minutes: wake,
                blocks: blocks.map((b) => ({
                  title: b.title,
                  entryId: b.entryId,
                  start_minutes: b.start,
                  duration_minutes: b.duration,
                })),
              }),
            })
          ).json();
        } catch (err) {
          alert(`Could not save: ${err.message}`);
          return;
        }

        if (res.error) {
          alert(res.error);
          return;
        }
        setSaved(true);
      };

      // --- the add sheet -------------------------------------------------------

      let formType = 'task';
      let formFreq = null;
      let formSize = null;

      // The id being edited, or null when adding. The sheet is one sheet: the
      // fields and the rules between them are identical either way, and two
      // copies of that form would be two places for the rules to drift.
      let editingId = null;

      function chooser(box, values, current, pick) {
        box.replaceChildren();
        for (const v of values) {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = v;
          b.setAttribute('aria-pressed', String(v === current));
          b.onclick = () => pick(v);
          box.append(b);
        }
      }

      /**
       * Which fields this type has.
       *
       * The size only appears once there is a due date, because a size with no
       * deadline to be measured against has nothing to say. That is the same
       * rule the server enforces; it is here so the field is never asked for
       * when it is not wanted.
       */
      function renderForm() {
        for (const b of $('type-seg').children) {
          b.setAttribute('aria-pressed', String(b.dataset.type === formType));
          // The type is fixed once set, and the server refuses to change it.
          // Offering the choice on an edit would be offering something that
          // cannot happen.
          b.disabled = editingId !== null;
        }
        $('type-seg').classList.toggle('fixed', editingId !== null);

        const dated = DATED.includes(formType);
        const hasDue = Boolean($('f-due').value);

        $('f-freq-field').classList.toggle('hidden', formType !== 'habit');
        $('f-due-field').classList.toggle('hidden', !dated);
        $('f-size-field').classList.toggle('hidden', !dated || !hasDue);

        chooser($('freq-seg'), FREQUENCIES, formFreq, (v) => {
          formFreq = v;
          renderForm();
        });
        chooser($('size-seg'), SIZES, formSize, (v) => {
          formSize = v;
          renderForm();
        });
      }

      for (const b of $('type-seg').children) {
        b.onclick = () => {
          formType = b.dataset.type;
          renderForm();
        };
      }

      $('f-due').onchange = renderForm;

      /** Adding when called with nothing, editing when called with a row. */
      function openSheet(item) {
        editingId = item ? item.id : null;

        formType = item ? item.type : 'task';
        formFreq = item ? item.frequency : null;
        formSize = item ? item.size : null;
        $('f-title').value = item ? item.title : '';
        $('f-due').value = item && item.due ? item.due : '';

        $('sheet-title').textContent = item ? 'Edit' : 'Add';
        $('add-save').textContent = item ? 'Save' : 'Add';

        $('f-problem').classList.add('hidden');
        renderForm();
        $('add-scrim').classList.remove('hidden');
        $('f-title').focus();
      }

      const closeSheet = () => {
        editingId = null;
        $('add-scrim').classList.add('hidden');
      };

      $('add-open').onclick = () => openSheet();
      $('add-cancel').onclick = closeSheet;
      $('add-scrim').onclick = (e) => {
        if (e.target === $('add-scrim')) closeSheet();
      };

      $('add-save').onclick = async () => {
        const problem = $('f-problem');
        const body = { type: formType, title: $('f-title').value.trim() };

        if (formType === 'habit') body.frequency = formFreq;
        if (DATED.includes(formType)) {
          body.due = $('f-due').value || '';
          // Sent even when empty, so clearing the date clears the size with
          // it rather than leaving a size behind with nothing to measure
          // against. The server applies the same rule to the merged row.
          body.size = body.due ? formSize : '';
        }

        const url = editingId ? `/entries/${editingId}/update` : '/entries';

        let res;
        try {
          res = await (
            await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            })
          ).json();
        } catch (err) {
          res = { error: err.message };
        }

        if (res.error) {
          problem.textContent = res.error;
          problem.classList.remove('hidden');
          return;
        }

        closeSheet();
        await load();
      };

      load();
      loadReview();
    </script>
  </body>
</html>
