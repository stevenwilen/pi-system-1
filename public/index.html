<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#fdf8f1" />
    <title>Personal Planning System</title>

    <link rel="manifest" href="/manifest.json" />

    <!-- iOS ignores the manifest for installation, so these carry the same
         information again. apple-touch-icon is the home screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      :root {
        /* Taken from the mascot. Coral is the brand; everything else is
           built around it. */
        --coral: #ff7a66;
        --coral-deep: #e85b45;
        --blush: #ffb4a3;
        --bg: #fff3ec;
        --surface: #ffffff;
        --sunk: #fce4da;
        --line: #f7ded3;

        /* One warm near-black for every piece of text. The dim variant is
           the same ink at lower opacity, so nothing turns grey. */
        --text: #2b2118;
        --muted: rgba(43, 33, 24, 0.55);

        --brand: var(--coral);
        /* Ink, not white: white on coral is about 2.5:1 and unreadable. */
        --brand-text: #2b2118;
        --danger: #c4432c;

        /* Category accents. Used only on chips and badges, never as
           general chrome, so they stay meaningful. */
        --plan: #ffc145;
        --plan-soft: #fff1d2;
        --plan-ink: #7d5a05;
        --habit: #2fb8a8;
        --habit-soft: #d7f4f0;
        --habit-ink: #12665c;
        --focus: #9b7be8;
        --focus-soft: #ede5fd;
        --focus-ink: #55399b;
        --task: #4a90d9;
        --task-soft: #dfecf9;
        --task-ink: #1f5b92;
        --idea: #e8a33d;
        --idea-soft: #fdeed6;
        --idea-ink: #8a5a06;
        --primary: #ff7a66;
        --primary-soft: #ffe4dc;
        --primary-ink: #a83a26;
        --quiet: #c3b3a1;
        --quiet-soft: #f4ece2;
        --quiet-ink: #6b5f52;

        --shadow-sm: 0 1px 2px rgba(120, 63, 45, 0.07);
        --shadow: 0 1px 2px rgba(120, 63, 45, 0.06),
          0 6px 16px rgba(120, 63, 45, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        /* ui-rounded resolves to SF Pro Rounded on iPhone, which is where the
           friendliness actually comes from. */
        font: 15px/1.5 ui-rounded, "SF Pro Rounded", -apple-system,
          BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Roboto,
          system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overscroll-behavior: none;
        /* kills the double-tap-to-zoom gesture and its 300ms tap delay */
        touch-action: manipulation;
      }

      header {
        flex: none;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 12px 18px 9px;
        padding-top: max(12px, env(safe-area-inset-top));
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
        background: var(--bg);
      }

      header img {
        width: 26px;
        height: 24px;
      }

      main {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 8px 16px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* A group holds a heading and any number of cards, so it needs its own
         gap. Without it two cards sit flush against each other. */
      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .group h2 {
        margin: 0;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        padding-left: 2px;
      }

      .card {
        background: var(--surface);
        border-radius: 18px;
        padding: 14px 15px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        box-shadow: var(--shadow);
      }

      .panel {
        background: var(--surface);
        border-radius: 18px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: var(--shadow);
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .pill {
        align-self: flex-start;
        font-size: 11px;
        font-weight: 650;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--habit-soft);
        color: var(--habit-ink);
      }

      .none {
        font-size: 13px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/mascot.svg" alt="" aria-hidden="true" />
      Planner
    </header>

    <main>
      <!-- Three sections, top to bottom, in the order they are used. See
           SPEC section 3. None of them are built: the chat interface they
           replace has been removed, and this is the ground it stood on. -->
      <div class="group">
        <h2>Review</h2>
        <div class="card"><span class="none">Yesterday's blocks, each with a one-tap "didn't happen". Not built.</span></div>
      </div>

      <div class="group">
        <h2>Stale</h2>
        <div class="card"><span class="none">Habits, projects and tasks in one list, longest since last scheduled at the top. Not built.</span></div>
      </div>

      <div class="group">
        <h2>Tomorrow</h2>
        <div class="card"><span class="none">The builder: blocks on 30 minute steps, pinned calendar events, a running end time. Not built.</span></div>
      </div>
    </main>
  </body>
</html>
