<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>Notebook</title>

    <link rel="manifest" href="/manifest.json" />

    <!-- iOS ignores the manifest for installation, so these carry the same
         information again. apple-touch-icon is the home screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PI" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f1f3f5;
        --text: #14171a;
        --muted: #6b7280;
        --accent: #2f6df6;
        --accent-text: #ffffff;
        --line: #e3e6ea;
        --danger: #b42318;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --surface: #1c2027;
          --text: #e8eaed;
          --muted: #949bA6;
          --accent: #4f83ff;
          --accent-text: #ffffff;
          --line: #262b33;
          --danger: #ff6b6b;
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        /* dvh keeps the composer above the mobile keyboard */
        height: 100dvh;
        overscroll-behavior: none;
      }

      header {
        flex: none;
        padding: 14px 16px calc(14px);
        padding-top: max(14px, env(safe-area-inset-top));
        border-bottom: 1px solid var(--line);
        font-weight: 600;
        letter-spacing: 0.01em;
        background: var(--bg);
      }

      nav.tabs {
        flex: none;
        display: flex;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }

      .tab {
        flex: 1;
        padding: 11px 8px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }

      .tab[aria-selected='true'] {
        color: var(--text);
        border-bottom-color: var(--accent);
      }

      .hidden {
        display: none !important;
      }

      /* --- what I've noticed --- */

      #noticed {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .card {
        background: var(--surface);
        border-radius: 14px;
        padding: 14px 15px;
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .card-text,
      .card-detail,
      .card-evidence {
        overflow-wrap: anywhere;
      }

      .card-detail {
        font-size: 14px;
        color: var(--muted);
      }

      .card-evidence {
        font-size: 13px;
        color: var(--muted);
      }

      .corrected {
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
      }

      .dots {
        display: inline-flex;
        gap: 3px;
        vertical-align: middle;
        margin-right: 4px;
      }

      .dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.25;
      }

      .dots span.on {
        opacity: 0.9;
      }

      .card-actions,
      .confirm {
        display: flex;
        gap: 2px;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .confirm .question {
        margin-right: auto;
        font-size: 13px;
        color: var(--muted);
      }

      .linkbtn {
        border: 0;
        background: none;
        color: var(--accent);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 8px;
        cursor: pointer;
      }

      .linkbtn.quiet {
        color: var(--muted);
      }

      .linkbtn.danger {
        color: var(--danger);
      }

      .linkbtn:disabled {
        opacity: 0.45;
      }

      .card textarea {
        width: 100%;
        resize: none;
        min-height: 78px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 16px;
      }

      .removed {
        font-size: 14px;
        color: var(--muted);
      }

      #log {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .msg {
        max-width: 78%;
        padding: 10px 13px;
        border-radius: 16px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .msg.me {
        align-self: flex-end;
        background: var(--accent);
        color: var(--accent-text);
        border-bottom-right-radius: 5px;
      }

      .msg.brain {
        align-self: flex-start;
        background: var(--surface);
        border-bottom-left-radius: 5px;
      }

      .msg.error {
        align-self: flex-start;
        background: transparent;
        border: 1px solid var(--danger);
        color: var(--danger);
        font-size: 14px;
      }

      .msg code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.9em;
        background: rgba(127, 127, 127, 0.18);
        padding: 1px 5px;
        border-radius: 5px;
      }

      .empty {
        margin: auto;
        color: var(--muted);
        font-size: 15px;
        text-align: center;
        padding: 0 24px;
      }

      /* thinking indicator */
      .dots {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        height: 1.5em;
      }

      .dots i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        animation: blink 1.3s infinite ease-in-out both;
      }

      .dots i:nth-child(2) {
        animation-delay: 0.18s;
      }

      .dots i:nth-child(3) {
        animation-delay: 0.36s;
      }

      @keyframes blink {
        0%,
        70%,
        100% {
          opacity: 0.25;
        }
        35% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dots i {
          animation: none;
          opacity: 0.5;
        }
      }

      form {
        flex: none;
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: var(--bg);
      }

      textarea {
        flex: 1;
        resize: none;
        max-height: 140px;
        padding: 11px 14px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        /* 16px keeps iOS Safari from zooming on focus */
        font-size: 16px;
      }

      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: -1px;
      }

      button {
        flex: none;
        padding: 0 20px;
        border: 0;
        border-radius: 22px;
        background: var(--accent);
        color: var(--accent-text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
    </style>
  </head>

  <body>
    <header>Notebook</header>

    <nav class="tabs" role="tablist">
      <button class="tab" id="tab-chat" role="tab" aria-selected="true">
        Chat
      </button>
      <button class="tab" id="tab-noticed" role="tab" aria-selected="false">
        What I've Noticed
      </button>
    </nav>

    <div id="log"><div class="empty">Start a conversation.</div></div>

    <div id="noticed" class="hidden"></div>

    <form id="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Message"
        autocomplete="off"
      ></textarea>
      <button id="send" type="submit">Send</button>
    </form>

    <script>
      const USER_ID = '00000000-0000-0000-0000-000000000001';

      const log = document.getElementById('log');
      const form = document.getElementById('composer');
      const input = document.getElementById('input');
      const send = document.getElementById('send');

      // Escape first, then apply a very small subset of markdown. The brain
      // writes **bold**, *italic* and `code`, and raw asterisks read badly.
      function render(text) {
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      }

      function atBottom() {
        return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
      }

      function bubble(who, text) {
        document.querySelector('.empty')?.remove();
        const stick = atBottom();

        const el = document.createElement('div');
        el.className = `msg ${who}`;
        if (text === null) {
          el.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
        } else {
          el.innerHTML = render(text);
        }

        log.appendChild(el);
        if (stick || who === 'me') el.scrollIntoView({ block: 'end' });
        return el;
      }

      function autogrow() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      }

      input.addEventListener('input', autogrow);

      // Enter sends, Shift+Enter makes a new line.
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const message = input.value.trim();
        if (!message || send.disabled) return;

        bubble('me', message);
        input.value = '';
        autogrow();

        send.disabled = true;
        const pending = bubble('brain', null);

        try {
          const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: USER_ID, message }),
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `server said ${res.status}`);

          pending.innerHTML = render(data.reply || '(no reply)');
        } catch (err) {
          pending.className = 'msg error';
          pending.textContent = err.message;
        } finally {
          send.disabled = false;
          if (atBottom()) pending.scrollIntoView({ block: 'end' });
          input.focus();
        }
      });

      // --- tabs -------------------------------------------------------------

      const tabChat = document.getElementById('tab-chat');
      const tabNoticed = document.getElementById('tab-noticed');
      const noticed = document.getElementById('noticed');

      function showView(which) {
        const isChat = which === 'chat';
        tabChat.setAttribute('aria-selected', String(isChat));
        tabNoticed.setAttribute('aria-selected', String(!isChat));
        log.classList.toggle('hidden', !isChat);
        form.classList.toggle('hidden', !isChat);
        noticed.classList.toggle('hidden', isChat);
        if (!isChat) loadObservations();
      }

      tabChat.addEventListener('click', () => showView('chat'));
      tabNoticed.addEventListener('click', () => showView('noticed'));

      // --- what I've noticed ------------------------------------------------

      // Quiet confidence: three dots, nothing numeric on screen.
      function dots(confidence) {
        const n =
          confidence == null ? 2 : confidence <= 40 ? 1 : confidence <= 75 ? 2 : 3;
        const label =
          confidence == null ? 'confidence not recorded' : `confidence ${confidence}`;

        const wrap = document.createElement('span');
        wrap.className = 'dots';
        wrap.title = label;
        wrap.setAttribute('aria-label', label);
        for (let i = 1; i <= 3; i++) {
          const d = document.createElement('span');
          if (i <= n) d.className = 'on';
          wrap.appendChild(d);
        }
        return wrap;
      }

      async function loadObservations() {
        noticed.innerHTML = '<div class="empty">Loading…</div>';
        try {
          const res = await fetch('/observations');
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `server said ${res.status}`);
          renderObservations(data.observations || []);
        } catch (err) {
          noticed.innerHTML = '';
          const e = document.createElement('div');
          e.className = 'msg error';
          e.textContent = err.message;
          noticed.appendChild(e);
        }
      }

      function renderObservations(list) {
        noticed.innerHTML = '';
        if (list.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = "Nothing noticed yet — I'll fill this in as we talk.";
          noticed.appendChild(empty);
          return;
        }
        for (const o of list) {
          const el = document.createElement('div');
          el.className = 'card';
          paintCard(el, o);
          noticed.appendChild(el);
        }
      }

      function paintCard(el, o) {
        el.innerHTML = '';

        const text = document.createElement('div');
        text.className = 'card-text';
        text.textContent = o.title || '';
        el.appendChild(text);

        if (o.body) {
          const detail = document.createElement('div');
          detail.className = 'card-detail';
          detail.textContent = o.body;
          el.appendChild(detail);
        }

        const meta = document.createElement('div');
        meta.className = 'card-evidence';
        meta.appendChild(dots(o.confidence));
        if (o.evidence) {
          const ev = document.createElement('span');
          ev.textContent = `Because: ${o.evidence}`;
          meta.appendChild(ev);
        }
        el.appendChild(meta);

        if (o.user_corrected) {
          const flag = document.createElement('div');
          flag.className = 'corrected';
          flag.textContent = 'Your wording';
          el.appendChild(flag);
        }

        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'linkbtn';
        editBtn.textContent = 'Edit';
        editBtn.onclick = () => startEdit(el, o);

        const delBtn = document.createElement('button');
        delBtn.className = 'linkbtn danger';
        delBtn.textContent = 'Delete';
        delBtn.onclick = () => confirmDelete(el, o);

        actions.append(editBtn, delBtn);
        el.appendChild(actions);
      }

      function startEdit(el, o) {
        el.innerHTML = '';

        const box = document.createElement('textarea');
        box.value = o.title || '';
        el.appendChild(box);

        const problem = document.createElement('div');
        problem.className = 'card-evidence';
        problem.style.color = 'var(--danger)';

        const actions = document.createElement('div');
        actions.className = 'card-actions';

        const cancel = document.createElement('button');
        cancel.className = 'linkbtn quiet';
        cancel.textContent = 'Cancel';
        cancel.onclick = () => paintCard(el, o);

        const save = document.createElement('button');
        save.className = 'linkbtn';
        save.textContent = 'Save';
        save.onclick = async () => {
          const text = box.value.trim();
          if (!text) return;

          save.disabled = true;
          problem.textContent = '';
          try {
            const res = await fetch(`/observations/${o.id}/edit`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `server said ${res.status}`);
            loadObservations();
          } catch (err) {
            save.disabled = false;
            problem.textContent = err.message;
          }
        };

        actions.append(cancel, save);
        el.append(problem, actions);
        box.focus();
      }

      function confirmDelete(el, o) {
        const actions = el.querySelector('.card-actions');
        actions.className = 'confirm';
        actions.innerHTML = '';

        const question = document.createElement('span');
        question.className = 'question';
        question.textContent = "Delete this? I won't learn it again.";

        const cancel = document.createElement('button');
        cancel.className = 'linkbtn quiet';
        cancel.textContent = 'Cancel';
        cancel.onclick = () => paintCard(el, o);

        const yes = document.createElement('button');
        yes.className = 'linkbtn danger';
        yes.textContent = 'Delete';
        yes.onclick = async () => {
          yes.disabled = true;
          try {
            const res = await fetch(`/observations/${o.id}/delete`, {
              method: 'POST',
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `server said ${res.status}`);

            el.innerHTML = '';
            const done = document.createElement('div');
            done.className = 'removed';
            done.textContent = "Removed. I won't learn this again.";
            el.appendChild(done);

            setTimeout(() => {
              el.style.transition = 'opacity .3s';
              el.style.opacity = '0';
              setTimeout(() => {
                el.remove();
                if (!noticed.querySelector('.card')) renderObservations([]);
              }, 300);
            }, 1300);
          } catch (err) {
            yes.disabled = false;
            question.textContent = err.message;
          }
        };

        actions.append(question, cancel, yes);
      }
    </script>
  </body>
</html>
