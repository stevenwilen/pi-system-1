<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#fdf8f1" />
    <title>Personal Planning System</title>

    <link rel="manifest" href="/manifest.json" />

    <!-- iOS ignores the manifest for installation, so these carry the same
         information again. apple-touch-icon is the home screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      :root {
        /* Taken from the mascot. Coral is the brand; everything else is
           built around it. */
        --coral: #ff7a66;
        --coral-deep: #e85b45;
        --blush: #ffb4a3;
        --bg: #fff3ec;
        --surface: #ffffff;
        --sunk: #fce4da;
        --line: #f7ded3;

        /* One warm near-black for every piece of text. The dim variant is
           the same ink at lower opacity, so nothing turns grey. */
        --text: #2b2118;
        --muted: rgba(43, 33, 24, 0.55);

        --brand: var(--coral);
        /* Ink, not white: white on coral is about 2.5:1 and unreadable. */
        --brand-text: #2b2118;
        --danger: #c4432c;

        /* Category accents. Used only on chips and badges, never as
           general chrome, so they stay meaningful. */
        --habit: #2fb8a8;
        --habit-soft: #d7f4f0;
        --habit-ink: #12665c;
        --project: #9b7be8;
        --project-soft: #ede5fd;
        --project-ink: #55399b;
        --task: #4a90d9;
        --task-soft: #dfecf9;
        --task-ink: #1f5b92;

        --shadow-sm: 0 1px 2px rgba(120, 63, 45, 0.07);
        --shadow: 0 1px 2px rgba(120, 63, 45, 0.06),
          0 6px 16px rgba(120, 63, 45, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        /* ui-rounded resolves to SF Pro Rounded on iPhone, which is where the
           friendliness actually comes from. */
        font: 15px/1.5 ui-rounded, "SF Pro Rounded", -apple-system,
          BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Roboto,
          system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overscroll-behavior: none;
        /* kills the double-tap-to-zoom gesture and its 300ms tap delay */
        touch-action: manipulation;
      }

      header {
        flex: none;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 12px 18px 9px;
        padding-top: max(12px, env(safe-area-inset-top));
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
        background: var(--bg);
      }

      header img {
        width: 26px;
        height: 24px;
      }

      main {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 4px 16px 28px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .group-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding-left: 2px;
      }

      .group-head h2 {
        margin: 0;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .card {
        background: var(--surface);
        border-radius: 18px;
        padding: 14px 15px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        box-shadow: var(--shadow);
      }

      .none {
        font-size: 13px;
        color: var(--muted);
      }

      /* --- buttons --- */

      .linkbtn {
        border: 0;
        background: none;
        padding: 0;
        font: inherit;
        font-size: 12.5px;
        font-weight: 650;
        color: var(--muted);
        cursor: pointer;
      }

      .linkbtn:active {
        color: var(--text);
      }

      .linkbtn.danger {
        color: var(--danger);
      }

      .addbtn {
        margin-left: auto;
        border: 0;
        border-radius: 999px;
        background: var(--coral);
        color: var(--brand-text);
        font: inherit;
        font-size: 12.5px;
        font-weight: 700;
        padding: 3px 12px;
        cursor: pointer;
      }

      .addbtn:active {
        background: var(--coral-deep);
        color: #fff;
      }

      .primary {
        border: 0;
        border-radius: 12px;
        background: var(--coral);
        color: var(--brand-text);
        font: inherit;
        font-weight: 700;
        padding: 9px 16px;
        cursor: pointer;
      }

      .primary:active {
        background: var(--coral-deep);
        color: #fff;
      }

      .primary:disabled {
        opacity: 0.5;
      }

      /* --- an item in the stale list --- */

      .item {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .item-top {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }

      .item-title {
        flex: 1;
        min-width: 0;
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: -0.005em;
        overflow-wrap: anywhere;
      }

      /* Days sit right and never wrap, so the column of numbers stays
         readable no matter how long the titles are. */
      .days {
        flex: none;
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        white-space: nowrap;
        padding-top: 2px;
      }

      .item-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .tag {
        font-size: 11px;
        font-weight: 650;
        padding: 2px 8px;
        border-radius: 999px;
      }

      .tag.habit {
        background: var(--habit-soft);
        color: var(--habit-ink);
      }
      .tag.project {
        background: var(--project-soft);
        color: var(--project-ink);
      }
      .tag.task {
        background: var(--task-soft);
        color: var(--task-ink);
      }

      .why {
        font-size: 12.5px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }

      .actions {
        margin-left: auto;
        display: flex;
        gap: 12px;
      }

      .card.paused {
        background: transparent;
        box-shadow: none;
        border: 1px dashed var(--line);
      }

      /* --- the add form --- */

      form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .seg {
        display: flex;
        gap: 4px;
        background: var(--sunk);
        border-radius: 12px;
        padding: 3px;
      }

      .seg button {
        flex: 1;
        border: 0;
        border-radius: 9px;
        background: none;
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        color: var(--muted);
        padding: 6px 0;
        cursor: pointer;
      }

      .seg button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow-sm);
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        font-weight: 650;
        color: var(--muted);
      }

      input,
      select,
      textarea {
        font: inherit;
        font-size: 15px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 9px 11px;
        width: 100%;
      }

      textarea {
        resize: vertical;
        min-height: 60px;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--blush);
        outline-offset: -1px;
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }

      .row .grow {
        flex: 1;
      }

      .err {
        font-size: 12.5px;
        color: var(--danger);
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="/mascot.svg" alt="" aria-hidden="true" />
      Planner
    </header>

    <main>
      <div class="group">
        <div class="group-head"><h2>Review</h2></div>
        <div class="card">
          <span class="none">Yesterday's blocks, each with a one-tap "didn't happen". Not built.</span>
        </div>
      </div>

      <div class="group">
        <div class="group-head">
          <h2>Stale</h2>
          <button class="addbtn" id="add-toggle" type="button">+ Add</button>
        </div>

        <div class="card hidden" id="add-card">
          <form id="add-form">
            <div class="seg" id="type-seg" role="group" aria-label="Type">
              <button type="button" data-type="habit" aria-pressed="false">Habit</button>
              <button type="button" data-type="project" aria-pressed="false">Project</button>
              <button type="button" data-type="task" aria-pressed="true">Task</button>
            </div>

            <label>
              Title
              <input id="f-title" type="text" autocomplete="off" />
            </label>

            <label class="hidden" id="f-frequency-wrap">
              Intended frequency
              <select id="f-frequency">
                <option value="daily">daily</option>
                <option value="few times a week">few times a week</option>
                <option value="weekly">weekly</option>
                <option value="monthly">monthly</option>
              </select>
            </label>

            <label class="hidden" id="f-why-wrap">
              Why this matters
              <textarea id="f-why"></textarea>
            </label>

            <label class="hidden" id="f-priority-wrap">
              Priority
              <input id="f-priority" type="number" min="1" step="1" inputmode="numeric" />
            </label>

            <div class="err hidden" id="f-error"></div>

            <div class="row">
              <button class="primary grow" type="submit" id="f-save">Save</button>
              <button class="linkbtn" type="button" id="f-cancel">Cancel</button>
            </div>
          </form>
        </div>

        <div id="stale"></div>
      </div>

      <div class="group hidden" id="paused-group">
        <div class="group-head"><h2>Paused</h2></div>
        <div id="paused"></div>
      </div>

      <div class="group">
        <div class="group-head"><h2>Tomorrow</h2></div>
        <div class="card">
          <span class="none">The builder: blocks on 30 minute steps, pinned calendar events, a running end time. Not built.</span>
        </div>
      </div>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const stale = $('stale');
      const paused = $('paused');

      let type = 'task';

      async function api(url, options) {
        const res = await fetch(url, options);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `request failed (${res.status})`);
        return data;
      }

      // "today", "1 day", "11 days". The unit is spelled out rather than
      // abbreviated to "11d" because this number is the whole point of the
      // panel and should read as a sentence, not a badge.
      function ageLabel(days) {
        if (days <= 0) return 'today';
        return `${days} day${days === 1 ? '' : 's'}`;
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function itemCard(item) {
        const card = el('div', 'card item' + (item.paused ? ' paused' : ''));

        const top = el('div', 'item-top');
        top.append(el('div', 'item-title', item.title));
        // Never-scheduled items count from when they were added, so the label
        // says which clock is running rather than implying a plan existed.
        const suffix = item.last_scheduled ? ' since scheduled' : ' since added';
        top.append(el('div', 'days', ageLabel(item.days) + suffix));
        card.append(top);

        if (item.why) card.append(el('div', 'why', item.why));

        const meta = el('div', 'item-meta');
        meta.append(el('span', 'tag ' + item.type, item.type));
        if (item.frequency) meta.append(el('span', 'none', item.frequency));
        if (item.priority) meta.append(el('span', 'none', 'priority ' + item.priority));

        const actions = el('div', 'actions');

        const pause = el('button', 'linkbtn', item.paused ? 'Resume' : 'Not now');
        pause.type = 'button';
        pause.onclick = () => act(`/entries/${item.id}/pause`, { paused: !item.paused });
        actions.append(pause);

        const del = el('button', 'linkbtn danger', 'Delete');
        del.type = 'button';
        del.onclick = () => {
          // Soft delete, but it cannot be undone from the app, so it asks.
          if (confirm(`Delete "${item.title}"?`)) act(`/entries/${item.id}/delete`, {});
        };
        actions.append(del);

        meta.append(actions);
        card.append(meta);
        return card;
      }

      async function act(url, body) {
        try {
          await api(url, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(body),
          });
          await load();
        } catch (err) {
          alert(err.message);
        }
      }

      async function load() {
        let data;
        try {
          data = await api('/entries');
        } catch (err) {
          stale.replaceChildren(el('div', 'card', err.message));
          return;
        }

        stale.replaceChildren();
        if (!data.items.length) {
          const empty = el('div', 'card');
          empty.append(el('span', 'none', 'Nothing here yet. Add a habit, project or task.'));
          stale.append(empty);
        } else {
          for (const item of data.items) stale.append(itemCard(item));
        }

        paused.replaceChildren();
        $('paused-group').classList.toggle('hidden', !data.paused.length);
        for (const item of data.paused) paused.append(itemCard(item));
      }

      // --- the add form ---

      function setType(next) {
        type = next;
        for (const b of $('type-seg').children) {
          b.setAttribute('aria-pressed', String(b.dataset.type === next));
        }
        $('f-frequency-wrap').classList.toggle('hidden', next !== 'habit');
        $('f-why-wrap').classList.toggle('hidden', next !== 'project');
        $('f-priority-wrap').classList.toggle('hidden', next !== 'project');
      }

      for (const b of $('type-seg').children) {
        b.onclick = () => setType(b.dataset.type);
      }

      function resetForm() {
        $('f-title').value = '';
        $('f-why').value = '';
        $('f-priority').value = '';
        $('f-frequency').value = 'daily';
        $('f-error').classList.add('hidden');
        setType('task');
      }

      $('add-toggle').onclick = () => {
        const card = $('add-card');
        const opening = card.classList.contains('hidden');
        card.classList.toggle('hidden', !opening);
        if (opening) {
          resetForm();
          $('f-title').focus();
        }
      };

      $('f-cancel').onclick = () => $('add-card').classList.add('hidden');

      $('add-form').onsubmit = async (event) => {
        event.preventDefault();
        const error = $('f-error');
        error.classList.add('hidden');
        $('f-save').disabled = true;

        try {
          await api('/entries', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              type,
              title: $('f-title').value,
              frequency: $('f-frequency').value,
              why: $('f-why').value,
              priority: $('f-priority').value,
            }),
          });
          $('add-card').classList.add('hidden');
          await load();
        } catch (err) {
          error.textContent = err.message;
          error.classList.remove('hidden');
        } finally {
          $('f-save').disabled = false;
        }
      };

      setType('task');
      load();
    </script>
  </body>
</html>
