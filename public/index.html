<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#16130F" />
    <title>Planner</title>

    <link rel="manifest" href="/manifest.json" />

    <!-- iOS ignores the manifest for installation, so these carry the same
         information again. apple-touch-icon is the home screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <style>
      /* One screen, read once in the evening.

         The rules the whole page is built on:

         - A row is a row. Things is plain rows with hairline dividers between
           them. Only a builder block is a card, because a card says "this is
           an object you move", and those are the only objects here that move
           — and a block that has already happened drops back to an outline,
           because it has stopped being one.
         - Sections are separated by space, not by borders or boxes. 36px is
           the separator.
         - One label style, everywhere. Actions sit on its baseline and are
           quieter than it, never louder.
         - Two text sizes in a row: 15px title, 12px meta, with real space
           between them.
         - Blue is actionable. It is on the steppers and on Confirm, and
           nowhere else. Nothing decorative is ever blue.
         - The warn colour is for warnings and for destruction, and nothing
           else. */
      :root {
        --bg: #16130f;
        --card: #211d18;
        --line: #2c2721;

        --text: #ede7de;
        --muted: #8b8177;
        --faint: #6b6459;

        --accent: #6e8cb8;
        --warn: #c4694a;

        /* A card held above the page. Not a new hue — the card tone lifted a
           step, so a block in your hand reads as raised rather than as a
           different kind of thing. */
        --card-raised: #2a2620;

        /* The calendar aside. Neutral warm grey: it is reference material,
           so it must read as neither actionable nor wrong. */
        --cal-rule: #4a423a;
        --cal-head: #9a8f80;
        --cal-text: #b0a79a;

        --gap: 36px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }

      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 28px 20px calc(40px + env(safe-area-inset-bottom));
      }

      .hidden {
        display: none !important;
      }

      /* Every time on the page lines up vertically with every other one. */
      .tnum {
        font-variant-numeric: tabular-nums;
      }

      /* --- the one label style ------------------------------------------- */

      .label {
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 14px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
      }

      /* On the label's baseline, and deliberately quieter than it: no
         uppercase, no tracking, no weight. The section is the heading; the
         action is a thing you may do, not a second heading. */
      .label .act {
        letter-spacing: 0;
        text-transform: none;
        font-size: 12px;
        color: var(--muted);
        background: none;
        border: 0;
        padding: 0;
        font-family: inherit;
        cursor: pointer;
      }

      .label .date {
        letter-spacing: 0;
        text-transform: none;
        font-size: 11px;
        color: var(--faint);
      }

      /* The switch IS the label. Same row, same height, same type as any other
         section heading — the word that used to name the day now chooses it,
         and there is no new control on the screen. */
      .dayswitch {
        display: flex;
        align-items: baseline;
        gap: 9px;
        margin-bottom: 14px;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .dayswitch .opt {
        /* Dimmer than faint. The day you are not looking at should be legible
           as a way back and nothing more. */
        color: #4a443c;
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        cursor: pointer;
      }
      .dayswitch .opt.on {
        color: var(--text);
      }
      .dayswitch .sep {
        color: #3a342d;
      }
      .dayswitch .date {
        letter-spacing: 0;
        text-transform: none;
        font-size: 11px;
        color: var(--faint);
        margin-left: 4px;
      }

      .section {
        margin-bottom: var(--gap);
      }

      /* --- plain rows, hairline dividers ---------------------------------- */

      .row {
        padding: 12px 0;
      }

      .row + .row {
        border-top: 1px solid var(--line);
      }

      .row-top {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .row .title {
        font-size: 15px;
        flex: 1;
        line-height: 1.35;
      }

      /* The meta line: its own line, with real space above it. */
      .row .meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 5px;
        line-height: 1.4;
      }


      .mark {
        font-size: 14px;
        color: var(--warn);
        letter-spacing: 1px;
      }

      /* Already in the day on screen. Greying is the whole signal: it said
         "in today's plan" beside this as well, which was a second way of
         saying what the colour already says. */
      .row.locked .title {
        color: var(--faint);
      }
      .row.locked .meta {
        color: var(--faint);
        opacity: 0.7;
      }




      .empty {
        font-size: 13px;
        color: var(--faint);
        padding: 2px 0 4px;
      }

      /* The hint that a row has more than one thing you can do to it.
         Faint rather than muted: it sits at the right edge of every row in
         the list, so at muted it would draw a second vertical line of
         emphasis down the page and compete with the titles. */
      .hint {
        font-size: 13px;
        color: var(--faint);
        background: none;
        border: 0;
        font-family: inherit;
        line-height: 1;
        padding: 0 2px;
        cursor: pointer;
      }

      /* Revealed by the hint. Hidden at rest, so the list reads as a list
         rather than as a menu. */
      .rowacts {
        display: flex;
        gap: 18px;
        margin-top: 9px;
      }
      .rowacts button {
        font-size: 12px;
        color: var(--muted);
        background: none;
        border: 0;
        padding: 0;
        font-family: inherit;
        cursor: pointer;
      }
      .rowacts .danger {
        color: var(--warn);
      }

      /* --- the calendar aside --------------------------------------------- */
      /* A left rule and indented text. Not a card, not blue, not a warning:
         this is what is already true about the day. */

      .cal {
        border-left: 2px solid var(--cal-rule);
        padding: 8px 0 8px 13px;
        margin-bottom: 22px;
      }
      .cal h4 {
        font-size: 12px;
        font-weight: 500;
        color: var(--cal-head);
      }
      .cal p {
        font-size: 13px;
        color: var(--cal-text);
        margin-top: 6px;
        line-height: 1.6;
        white-space: pre-line;
        font-variant-numeric: tabular-nums;
      }
      .cal .failed {
        color: var(--warn);
      }

      /* --- inline control, not a card ------------------------------------- */

      .inline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
      }
      .inline > span {
        font-size: 13px;
        color: var(--muted);
      }

      .stepper {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      /* Blue, because pressing it changes the day. */
      .step {
        color: var(--accent);
        font-size: 18px;
        line-height: 1;
        background: none;
        border: 0;
        font-family: inherit;
        padding: 2px 6px;
        cursor: pointer;
      }
      .step:disabled {
        color: var(--faint);
      }
      .num {
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        min-width: 46px;
        text-align: center;
      }

      /* --- blocks ARE cards ------------------------------------------------ */
      /* Because they are objects you manipulate — and a block is the only thing
         on this page you manipulate with a gesture rather than a button. Tap
         its duration to lengthen it, swipe it away or swipe a buffer in after
         it, hold it to pick it up and move it. */

      /* The slot holds the card and the backing the card slides off to reveal.
         Overflow is clipped here so a backing cannot bleed past the corner
         radius while the card is mid-swipe. */
      .slot {
        position: relative;
        margin-bottom: 9px;
        border-radius: 11px;
        overflow: hidden;
      }

      /* One surface for both swipes, and the edge the label sits at is the
         only thing that differs.

         The removing side used to fill with the warn colour, which turned the
         whole card red under the finger. That was a lot of shouting for
         something that carries a six-second undo, and it shouted loudest on a
         past block — where taking a block out is not destruction at all, it is
         how you record that the thing did not happen.

         There was a loudness axis here as well as a side, from when left meant
         two different things depending on the clock. Left means one thing now
         and neither swipe is loud, so the axis is gone rather than left in
         place holding a single value. */
      .backing {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        padding: 0 18px;
        font-size: 13px;
        opacity: 0;
        background: var(--line);
        color: var(--text);
      }
      .backing.left {
        justify-content: flex-end;
      }
      .backing.right {
        justify-content: flex-start;
      }

      .block {
        position: relative;
        background: var(--card);
        border-radius: 11px;
        padding: 14px 15px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        /* Vertical pans belong to the page, horizontal ones are ours. This one
           line is what lets a swipe and a scroll live on the same element
           without arbitrating between them in script. */
        touch-action: pan-y;
        user-select: none;
        -webkit-user-select: none;
      }
      /* The block's own line: what it is, and how long. A note, when there is
         one, sits under this rather than beside it. */
      .brow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .block .t {
        font-size: 15px;
      }
      .block .time {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        font-variant-numeric: tabular-nums;
      }

      /* What they said they were doing. Small and muted, so a glance down the
         day shows which blocks carry one without any of them shouting. */
      .note {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.45;
        margin-top: 9px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      /* The same line, open for writing. A rule under it and nothing else: it
         is a note on a card, not a form on one. */
      .noteedit {
        margin-top: 9px;
        width: 100%;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        color: var(--text);
        font: inherit;
        font-size: 13px;
        line-height: 1.45;
        padding: 2px 0 5px;
        resize: none;
        /* Typing is not a gesture. The card above is pan-y; this is not. */
        touch-action: auto;
        user-select: text;
        -webkit-user-select: text;
      }
      .noteedit::placeholder {
        color: var(--faint);
      }
      .noteedit:focus {
        outline: none;
        border-bottom-color: var(--muted);
      }

      /* A block that has already happened. An outline rather than a filled
         card: still there, still part of the day, but no longer an object you
         pick up and move. */
      .block.past {
        background: transparent;
        border: 1px solid var(--line);
      }
      .block.past .t {
        color: var(--faint);
      }
      .block.past .time {
        color: #544e46;
      }

      /* The block you are in, in the slot the duration chip has vacated.
         Muted rather than faint: it is the one block on the page that is
         happening, and faint is the register of a block that is over. No
         border and no background, so nothing about it suggests a press.

         Named .running, not .act: .act is already the "+ Add" affordance in a
         section label, and an unscoped .act here bled onto it. */
      .running {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }

      /* Where the past ends: a dot and a rule running out to the edge. It
         carried a word between them once, and the word kept having to be a
         claim about one side of the line or the other. */
      .now {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0 13px;
      }
      .now .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
      }
      .now .ln {
        flex: 1;
        height: 1px;
        background: #2b3646;
      }

      /* Picked up. Bigger, lighter, casting a shadow: it has to be obvious
         that this one is in your hand and the rest are not. */
      .slot.lifted {
        overflow: visible;
        z-index: 3;
      }
      .block.lifted {
        background: var(--card-raised);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      }
      .slot.dimmed {
        opacity: 0.55;
      }

      /* The duration is now the control, not a readout, so it looks pressable
         and it is blue — the same rule as everywhere else, blue is the thing
         you can act on. It replaced a pair of steppers that were blue for
         exactly that reason. */
      .dur {
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        color: var(--accent);
        background: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 15px;
        min-width: 66px;
        text-align: center;
        font-family: inherit;
        cursor: pointer;
        touch-action: pan-y;
      }

      /* The safety net for a swipe, which commits with no confirm. */
      .undo {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(20px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 11px;
        padding: 11px 16px;
        font-size: 13px;
        color: var(--muted);
        z-index: 20;
      }
      .undo button {
        background: none;
        border: 0;
        padding: 0;
        font-family: inherit;
        font-size: 13px;
        color: var(--accent);
        cursor: pointer;
      }

      .addblock {
        font-size: 12px;
        color: var(--faint);
        padding-top: 8px;
        background: none;
        border: 0;
        font-family: inherit;
        cursor: pointer;
      }

      .ends {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-top: 28px;
        padding-bottom: 20px;
      }
      .ends span {
        font-size: 13px;
        color: var(--muted);
      }
      .ends b {
        font-size: 17px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }
      /* A day running past midnight is the one thing the end time can be
         wrong about, so it is said in the miss colour. */
      .ends.late b {
        color: var(--warn);
      }

      /* Blue, because it is the one thing on this page that commits. */
      .confirm {
        display: block;
        width: 100%;
        background: var(--accent);
        color: var(--bg);
        text-align: center;
        padding: 14px;
        border-radius: 11px;
        font-size: 14px;
        font-weight: 600;
        border: 0;
        font-family: inherit;
        cursor: pointer;
      }
      .confirm:disabled {
        background: var(--card);
        color: var(--faint);
      }

      /* --- the add sheet --------------------------------------------------- */

      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        z-index: 10;
      }
      .sheet {
        background: var(--bg);
        width: 100%;
        max-width: 480px;
        border-radius: 18px 18px 0 0;
        padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
        max-height: 88vh;
        overflow-y: auto;
      }

      .field {
        margin-bottom: 20px;
      }
      .field > label {
        display: block;
        font-size: 10px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .field input[type="text"],
      .field input[type="date"] {
        width: 100%;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        color: var(--text);
        font: inherit;
        padding: 6px 0;
      }
      .field input:focus {
        outline: none;
        border-bottom-color: var(--muted);
      }

      /* Choices read as text, not as controls. The chosen one is simply the
         one that is not dimmed — no fill and no blue, because picking a type
         is not an action against the day. */
      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .choices button {
        font-size: 13px;
        color: var(--faint);
        background: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 13px;
        font-family: inherit;
        cursor: pointer;
      }
      .choices button[aria-pressed="true"] {
        color: var(--text);
        border-color: var(--muted);
      }

      /* Editing: the type cannot change, so the chooser stops being a chooser
         and becomes a statement of what this row is. The chosen one still
         reads normally; the others go, rather than sitting there greyed and
         inviting a press that will not work. */
      .choices.fixed button[aria-pressed="false"] {
        display: none;
      }
      .choices.fixed button {
        border-color: transparent;
        padding-left: 0;
      }

      .sheet-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 26px;
      }
      .sheet-actions .cancel {
        font-size: 13px;
        color: var(--muted);
        background: none;
        border: 0;
        font-family: inherit;
        cursor: pointer;
      }
      .sheet-actions .save {
        background: var(--accent);
        color: var(--bg);
        border: 0;
        border-radius: 11px;
        padding: 12px 26px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .problem {
        font-size: 12px;
        color: var(--warn);
        margin-top: 14px;
      }

      /* Reorder stays fully functional here — only the motion goes. The card
         still lightens and the others still step back, because those say
         "this one is in your hand" and that is information, not decoration.
         What goes is the growing, the shadow and every transition. */
      @media (prefers-reduced-motion: reduce) {
        .slot,
        .block {
          transition: none !important;
        }
        .block.lifted {
          box-shadow: none;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <!-- 1. THINGS --------------------------------------------------------- -->
      <section class="section">
        <div class="label">
          Things
          <button type="button" class="act" id="add-open">+ Add</button>
        </div>
        <div id="things"></div>
      </section>

      <!-- 2. THE DAY -------------------------------------------------------- -->
      <section>
        <!-- The switch is the label. No new control: the heading that said
             which day this was now says which day you are looking at, and
             either word can be pressed. -->
        <div class="dayswitch">
          <button type="button" class="opt" id="pick-today">Today</button>
          <span class="sep">/</span>
          <button type="button" class="opt" id="pick-tomorrow">Tomorrow</button>
          <span class="date" id="plan-date"></span>
        </div>

        <div class="cal" id="cal">
          <h4>On your calendar</h4>
          <p id="cal-list"></p>
        </div>

        <!-- Hidden on today: the day has already started, so there is nothing
             to decide about when it does. -->
        <div class="inline" id="starts">
          <span>Starts</span>
          <div class="stepper">
            <button type="button" class="step" id="wake-minus">&minus;</button>
            <span class="num" id="wake-time">8:00 AM</span>
            <button type="button" class="step" id="wake-plus">+</button>
          </div>
        </div>

        <div style="height: 14px"></div>

        <div id="builder"></div>

        <button type="button" class="addblock" id="add-block">+ Block</button>

        <div class="ends" id="ends">
          <span>Day ends</span>
          <b class="tnum" id="end-time">—</b>
        </div>

        <button type="button" class="confirm" id="confirm">Confirm</button>
      </section>
    </main>

    <!-- Where the "Removed · Undo" bar lives. A fixed element needs somewhere
         to be appended, and appending to <body> would be the one place the
         script reaches outside an id it declared. -->
    <div id="undo-host"></div>

    <!-- the add sheet ------------------------------------------------------- -->
    <div class="scrim hidden" id="add-scrim">
      <div class="sheet">
        <div class="label" id="sheet-title">Add</div>

        <div class="field">
          <label>Type</label>
          <div class="choices" id="type-seg">
            <button type="button" data-type="habit">habit</button>
            <button type="button" data-type="project">project</button>
            <button type="button" data-type="task">task</button>
          </div>
        </div>

        <div class="field">
          <label for="f-title">Title</label>
          <input type="text" id="f-title" autocomplete="off" />
        </div>

        <div class="field hidden" id="f-freq-field">
          <label>Frequency</label>
          <div class="choices" id="freq-seg"></div>
        </div>

        <div class="field hidden" id="f-due-field">
          <label for="f-due">Due date</label>
          <input type="date" id="f-due" />
        </div>

        <div class="field hidden" id="f-size-field">
          <label>Size</label>
          <div class="choices" id="size-seg"></div>
        </div>

        <div class="problem hidden" id="f-problem"></div>

        <div class="sheet-actions">
          <button type="button" class="cancel" id="add-cancel">Cancel</button>
          <button type="button" class="save" id="add-save">Add</button>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      // The step everything moves in. Half an hour is the smallest unit this
      // system expresses: block durations, the start time, all of it.
      const STEP = 30;

      // The longest a block can be. Four hours is already a long stretch to
      // hold, and it is the ceiling the duration cycles back from.
      const MAX_DURATION = 4 * 60;

      // How long a press has to be still before the block comes up.
      const HOLD_MS = 400;

      // Movement before a gesture is decided. Below this nothing has been
      // asked for yet, and a finger resting on a card never travels zero.
      const SLOP = 8;

      // How far a swipe has to go to mean it. Deliberately most of a thumb's
      // travel: this commits with no confirmation, so it must not be reachable
      // by a hand that was doing something else.
      const SWIPE_COMMIT = 72;

      // How long the undo stays up.
      const UNDO_MS = 6000;

      // Settling a swipe back, and dropping a reorder.
      const SETTLE_MS = 180;

      // Read each time rather than cached, so changing it in the OS takes
      // effect without a reload. Guarded because the suite runs this script in
      // a VM with no matchMedia.
      const reduceMotion = () =>
        typeof matchMedia === 'function' &&
        matchMedia('(prefers-reduced-motion: reduce)').matches;

      // The hours a person actually gets up. Outside these the stepper would
      // be being flexible rather than helpful.
      const WAKE_MIN = 4 * 60;
      const WAKE_MAX = 12 * 60;

      const SIZES = ['a day', 'a few days', 'a week', 'a few weeks', 'months'];
      const FREQUENCIES = ['daily', 'few times a week', 'weekly', 'monthly'];

      // A due date belongs to these two. A habit has a cadence instead.
      const DATED = ['project', 'task'];

      const pad = (n) => String(n).padStart(2, '0');

      /**
       * Minutes past midnight as a clock time, wrapping past midnight.
       *
       * Twelve hour, because that is how the person reads a clock. Midnight is
       * 12 AM and noon is 12 PM: hour 0 and hour 12 both display as 12, which
       * is the one case a naive modulo gets wrong.
       *
       * Storage is untouched — every time in the database is still minutes or
       * a 24 hour `time`, and this is the only place that decides how one
       * looks.
       */
      function clock(mins) {
        const at = ((mins % 1440) + 1440) % 1440;
        const h = Math.floor(at / 60);
        const hour = h % 12 === 0 ? 12 : h % 12;
        return `${hour}:${pad(at % 60)} ${h < 12 ? 'AM' : 'PM'}`;
      }

      /**
       * A duration as a person says it: 30m, 1h, 1.5h, 2h, 2.5h.
       *
       * Everything the chip and the start stepper produce is a multiple of
       * half an hour, so the only fraction that ever comes up is .5 — and one
       * number reads faster on a chip than two.
       *
       * The last line is for a length from an older grid, where the step was
       * fifteen minutes. 1h 15m has no half to write, so it is said plainly
       * rather than rounded into something the row is not.
       */
      function span(mins) {
        const h = Math.floor(mins / 60);
        const m = mins % 60;
        if (!h) return `${m}m`;
        if (!m) return `${h}h`;
        if (m === 30) return `${h}.5h`;
        return `${h}h ${m}m`;
      }

      const toMinutes = (t) => {
        const [h, m] = String(t).split(':').map(Number);
        return h * 60 + m;
      };

      const addDays = (date, n) => {
        const d = new Date(`${date}T12:00:00Z`);
        d.setUTCDate(d.getUTCDate() + n);
        return d.toISOString().slice(0, 10);
      };

      const prettyDate = (date) =>
        new Intl.DateTimeFormat('en-GB', {
          weekday: 'short',
          day: 'numeric',
          month: 'short',
          timeZone: 'UTC',
        }).format(new Date(`${date}T12:00:00Z`));

      // --- state --------------------------------------------------------------

      let things = [];
      let blocks = []; // { id, title, entryId, duration, note, sent, start }
      let wake = 8 * 60;
      let saved = false;

      // Which day is on screen, and the two dates it chooses between. `today`
      // is the person's own date, read from the server rather than the device,
      // because the day boundary that matters is theirs.
      let today = null;
      let timeZone = 'UTC';
      let showing = 'tomorrow';

      const planDateFor = (which) => (which === 'today' ? today : addDays(today, 1));
      const planDate = () => planDateFor(showing);

      /**
       * The time it is where this person lives, in minutes past their midnight.
       *
       * Read from their timezone rather than the device's, for the same reason
       * the date is: a phone carried into another zone must not decide that
       * half their day has already happened.
       */
      function nowMinutes() {
        const parts = new Intl.DateTimeFormat('en-GB', {
          timeZone,
          hour: '2-digit',
          minute: '2-digit',
          hourCycle: 'h23',
        })
          .formatToParts(new Date())
          .reduce((acc, p) => ({ ...acc, [p.type]: p.value }), {});
        return Number(parts.hour) * 60 + Number(parts.minute);
      }

      /** The next half hour, which is where a block added to today begins. */
      const nextBoundary = () => Math.ceil(nowMinutes() / STEP) * STEP;

      const onToday = () => showing === 'today';

      // Test seam: a suite needs to put the page into the state a saved day
      // leaves it in without driving a real confirm through the network.
      function setSaved(v) {
        saved = v;
        renderConfirm();
      }

      // --- things -------------------------------------------------------------

      /** How a deadline reads. */
      function dueText(days) {
        if (days < 0) return `${-days} day${-days === 1 ? '' : 's'} overdue`;
        if (days === 0) return 'due today';
        if (days === 1) return 'due tomorrow';
        return `due in ${days} days`;
      }

      /**
       * The meta line: type, then either the deadline and its size, or how
       * long this has been sitting there.
       *
       * "since scheduled" and "since added" are different claims, and the row
       * says which one it is making. Something never scheduled is counted from
       * the day it was written down, and calling that "since scheduled" would
       * be reporting a scheduling that never happened.
       */
      function metaFor(item) {
        if (item.due) {
          return [item.type, dueText(item.days_until_due), item.size]
            .filter(Boolean)
            .join(' · ');
        }

        const noun = item.last_scheduled ? 'scheduled' : 'added';
        if (item.days === 0) return `${item.type} · ${noun} today`;
        return `${item.type} · ${item.days} day${item.days === 1 ? '' : 's'} since ${noun}`;
      }

      async function load() {
        let data;
        try {
          data = await (await fetch('/entries')).json();
        } catch {
          return;
        }

        things = data.items || [];

        if (!today) {
          today = data.today;
          timeZone = data.timezone || 'UTC';
          wake = toMinutes(data.wake_time || '08:00');

          // Which day the screen opens on. An evening planner is here to plan
          // tomorrow; a morning planner is here to plan the day they are in.
          showing = data.plans_in === 'morning' ? 'today' : 'tomorrow';

          await showDay(showing);
        }

        renderThings();
        renderWake();
      }

      /**
       * Put a day on screen: its calendar, its plan, its shape.
       *
       * Everything held about the day being built is replaced, because the two
       * days share nothing. Anything unconfirmed on the day being left is
       * dropped, which is the same thing that happens on a page reload.
       */
      async function showDay(which) {
        showing = which;
        clearUndo();

        const date = planDate();
        $('plan-date').textContent = prettyDate(date);
        $('pick-today').classList.toggle('on', which === 'today');
        $('pick-tomorrow').classList.toggle('on', which === 'tomorrow');

        // The day has already started, so there is nothing to decide about
        // when it does.
        $('starts').classList.toggle('hidden', onToday());

        blocks = [];
        saved = false;

        await loadCalendar(date);
        await loadPlan(date);

        renderWake();
        renderThings();
      }

      // The promise is returned rather than dropped. Nothing in the browser
      // waits on it, but a suite driving the switch has to know when the day
      // it asked for is actually on screen.
      $('pick-today').onclick = () => (onToday() ? null : showDay('today'));
      $('pick-tomorrow').onclick = () => (onToday() ? showDay('tomorrow') : null);

      /**
       * Is this thing already a block in the day on screen?
       *
       * Read off the blocks the builder is holding rather than off anything
       * stored, so removing a block unlocks its row on the same render — and
       * so the answer follows the switch: a thing in tomorrow is not locked
       * while you are looking at today.
       */
      const inShownPlan = (entryId) =>
        Boolean(entryId) && blocks.some((b) => b.entryId === entryId);

      /** The last block this thing has in the day, or -1. */
      const lastBlockFor = (entryId) => {
        for (let i = blocks.length - 1; i >= 0; i--) {
          if (blocks[i].entryId === entryId) return i;
        }
        return -1;
      };

      /** Has this block started? The one definition, used everywhere. */
      const blockBegun = (b) => onToday() && hasBegun(b, nowMinutes());

      /**
       * Take a thing back out of the day.
       *
       * The last of its blocks, so a thing scheduled twice loses one tap at a
       * time and stays greyed until none are left.
       *
       * Whatever the clock says. A block that had begun used to be exempt,
       * because the server refused to remove one that had been delivered; it
       * no longer does, and the row would otherwise be the last place still
       * enforcing a rule nothing behind it holds.
       *
       * It goes through removeBlock, so it is undoable like any other removal.
       */
      function unschedule(entryId) {
        const at = lastBlockFor(entryId);
        if (at === -1) return;
        removeBlock(at);
      }

      function renderThings() {
        const box = $('things');
        box.replaceChildren();

        if (!things.length) {
          const none = document.createElement('div');
          none.className = 'empty';
          none.textContent = 'Nothing here yet.';
          box.append(none);
          return;
        }

        for (const item of things) box.append(thingRow(item));
      }

      /**
       * One thing.
       *
       * Tapping the row puts it in tomorrow, which is what this list is for.
       * Everything else you can do to it sits behind the hint at the right
       * edge, so the resting state of the list is still a list — but the fact
       * that there is more there is visible rather than something you have to
       * already know.
       *
       * This used to be a long press with nothing on screen to suggest it.
       */
      function thingRow(item) {
        // Already in the day on screen. It cannot be added twice, so the row
        // says where it is instead of offering to put it there again.
        const locked = inShownPlan(item.id);

        const row = document.createElement('div');
        row.className = locked ? 'row locked' : 'row';
        row.dataset.id = item.id;

        const top = document.createElement('div');
        top.className = 'row-top';

        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = item.title;
        top.append(title);

        // '!!!', '!!' or '!'. Computed on the server and arithmetic all the
        // way down: the days the size needs against the days that are left.
        //
        // Not on a row already in the day. The mark asks "does this need your
        // attention" and being scheduled answers it, so a greyed row still
        // shouting a deadline would be arguing with itself.
        if (!locked && item.mark) {
          const mark = document.createElement('div');
          mark.className = 'mark';
          mark.textContent = item.mark;
          top.append(mark);
        }

        const hint = document.createElement('button');
        hint.type = 'button';
        hint.className = 'hint';
        hint.textContent = '···';
        hint.setAttribute('aria-label', `More for ${item.title}`);
        top.append(hint);

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = metaFor(item);

        row.append(top, meta);

        const acts = document.createElement('div');
        acts.className = 'rowacts hidden';

        // Tasks only. A habit recurring is the point of a habit, and a project
        // is not finished by one session of work on it.
        if (item.type === 'task') {
          const done = document.createElement('button');
          done.type = 'button';
          done.textContent = 'Done';
          done.onclick = (e) => {
            e.stopPropagation();
            finish(item.id);
          };
          acts.append(done);
        }

        const edit = document.createElement('button');
        edit.type = 'button';
        edit.textContent = 'Edit';
        edit.onclick = (e) => {
          e.stopPropagation();
          acts.classList.add('hidden');
          openSheet(item);
        };
        acts.append(edit);

        // Last, and the only one in the miss colour. Delete sitting between
        // two ordinary actions is a misclick waiting to happen.
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'danger';
        del.textContent = 'Delete';
        del.onclick = (e) => {
          e.stopPropagation();
          if (confirm(`Delete "${item.title}"?`)) remove(item.id);
        };
        acts.append(del);
        row.append(acts);

        hint.onclick = (e) => {
          // Without this the row's own handler fires straight afterwards and
          // schedules the thing the person was only asking about.
          e.stopPropagation();
          acts.classList.toggle('hidden');
        };

        row.onclick = () => {
          // An open menu closes rather than scheduling. Tapping away from a
          // menu you opened should undo the opening, not commit to something.
          if (!acts.classList.contains('hidden')) {
            acts.classList.add('hidden');
            return;
          }
          // Already in the day, so a tap takes it back out rather than putting
          // it in twice. The menu above is unaffected either way.
          if (locked) return unschedule(item.id);
          addBlock({ title: item.title, entryId: item.id });
        };

        return row;
      }

      async function finish(id) {
        try {
          await fetch(`/entries/${id}/done`, { method: 'POST' });
        } catch {
          return;
        }
        things = things.filter((t) => t.id !== id);
        renderThings();
      }

      async function remove(id) {
        try {
          await fetch(`/entries/${id}/delete`, { method: 'POST' });
        } catch {
          return;
        }
        things = things.filter((t) => t.id !== id);
        renderThings();
      }

      // --- 3. tomorrow ---------------------------------------------------------

      /**
       * The calendar aside.
       *
       * Read, shown, forgotten. Nothing here is placed into the day and
       * nothing about it is stored: it is what is already true about tomorrow,
       * and what to do about it is the person's decision to make.
       */
      async function loadCalendar(date) {
        let data;
        try {
          data = await (await fetch(`/calendar/${date}`)).json();
        } catch {
          return;
        }

        const lines = (data.items || []).map((e) =>
          e.start_minutes === null ? e.title : `${e.title}, ${clock(e.start_minutes)}`
        );

        const box = $('cal-list');
        box.replaceChildren();
        box.textContent = lines.length ? lines.join('\n') : 'Nothing on it.';

        // A feed that is down and a quiet Tuesday produce the same empty list,
        // so a failure is said out loud rather than left to look like a free
        // day.
        for (const f of data.failed || []) {
          const warn = document.createElement('span');
          warn.className = 'failed';
          warn.textContent = `\n${f.label} could not be read.`;
          box.append(warn);
        }
      }

      /** A day already confirmed, so it survives a page load. */
      async function loadPlan(date) {
        let data;
        try {
          data = await (await fetch(`/plan/${date}`)).json();
        } catch {
          return renderBuilder();
        }
        if (!data.plan) return renderBuilder();

        wake = data.plan.wake_minutes;
        blocks = (data.blocks || []).map((b) => ({
          // The row's own id, kept so the next confirm can say which block
          // this is. Without it the server has no identity to reconcile
          // against and has to rebuild the day, which loses whether the block
          // was sent.
          id: b.id || null,
          title: b.title,
          entryId: b.entryId,
          duration: b.duration_minutes,
          note: b.note || null,
          // `sent` is deliberately not kept. The screen used to read it to
          // decide what to offer on a delivered block, and now decides that
          // from the clock instead — a block that has begun keeps its hour and
          // its length whether or not the delivery job has run yet, which is
          // the stricter of the two and never the wrong way round. The server
          // still returns it and still enforces its own rule.
          // Where the day says this block is. Only today reads it: a block
          // that has already begun keeps the hour it began at, whatever the
          // blocks above it do afterwards.
          storedStart: b.start_minutes,
        }));
        saved = data.plan.status === 'confirmed';
        renderWake();
        renderBuilder();
      }

      /**
       * Blocks flow in sequence from the start time.
       *
       * Nothing is pinned and nothing is placed automatically, so a block
       * begins when the one above it ends and that is the whole rule. Changing
       * one duration shifts everything below it, which is what the chips are
       * for.
       *
       * Today is the one day with a past in it, and the past does not flow.
       * A block that has already begun keeps the hour it began at — the
       * message naming that hour has usually gone out, and a plan that
       * rewrote this morning as the afternoon would be a plan about a day
       * nobody lived. Everything still to come flows from the later of where
       * the last block ended and the next half hour, so a block added now
       * lands ahead of now rather than back at the wake time.
       */
      const hasBegun = (b, now) =>
        b.storedStart !== undefined && b.storedStart !== null && b.storedStart <= now;

      function reflow() {
        const live = onToday();
        const now = live ? nowMinutes() : 0;
        const floor = live ? nextBoundary() : 0;

        let cursor = wake;

        for (const b of blocks) {
          b.start = live && hasBegun(b, now) ? b.storedStart : live ? Math.max(cursor, floor) : cursor;
          cursor = b.start + b.duration;
        }
        return cursor;
      }

      /**
       * Has the day on screen drifted from the day in the database?
       *
       * On today it can, without anyone touching anything: a day that has run
       * late has its remaining blocks pushed to the next half hour, so what is
       * left sits ahead of now rather than behind it. The screen must not call
       * that "Confirmed" — the times it is showing are not the times delivery
       * would use.
       */
      const drifted = () =>
        blocks.some(
          (b) => b.storedStart !== undefined && b.storedStart !== null && b.start !== b.storedStart
        );

      // Every new block starts at one step. It grows by tapping its duration,
      // which is one press per half hour and no presses at all for the common
      // case of a short thing.
      function addBlock({ title, entryId = null, duration = STEP }) {
        blocks.push({ title, entryId, duration });
        saved = false;
        renderBuilder();
      }

      function setWake(mins) {
        wake = mins;
        renderWake();
        renderBuilder();
      }

      function renderWake() {
        $('wake-time').textContent = clock(wake);
        $('wake-minus').disabled = wake <= WAKE_MIN;
        $('wake-plus').disabled = wake >= WAKE_MAX;
      }

      // A day saved off the half hour — from a build when the step was fifteen
      // minutes — is corrected by one press rather than kept off the grid for
      // ever.
      const stepUp = (v) => Math.min(WAKE_MAX, Math.floor(v / STEP) * STEP + STEP);
      const stepDown = (v) => Math.max(WAKE_MIN, Math.ceil(v / STEP) * STEP - STEP);

      $('wake-minus').onclick = () => {
        saved = false;
        setWake(stepDown(wake));
      };
      $('wake-plus').onclick = () => {
        saved = false;
        setWake(stepUp(wake));
      };

      function renderBuilder() {
        const end = reflow();
        const box = $('builder');
        box.replaceChildren();

        const now = onToday() ? nowMinutes() : null;
        let markedNow = false;

        for (const [i, b] of blocks.entries()) {
          // Two different lines, and the difference is the whole of this.
          //
          //   begun  its start time has passed. It is the day that happened,
          //          or is happening, and nothing about it can be changed.
          //   past   its end time has passed as well, so it is over.
          //
          // Everything past is begun. What sits between them is the block you
          // are in right now, which used to be treated as upcoming — it kept
          // its duration chip, and shrinking it below the time already elapsed
          // quietly moved it into the past. The server refuses to resize a
          // delivered block, so the screen was offering something that would
          // have been rejected on the way out.
          // Read off the STORED start, which is the same question reflow asks
          // when it decides what to hold in place. Reading the recomputed one
          // was wrong in a way that took a test to see: a block reflow had just
          // pushed to the next half hour could land exactly on now, and would
          // then lock itself the moment it arrived — a block that has never
          // been anywhere near the past becoming unremovable because the clock
          // caught up with where it was moved to.
          const begun = blockBegun(b);
          const past = begun && b.start + b.duration <= now;

          // Once, above the first block that has not ENDED. What is above the
          // line has happened; what is below it is happening or still to come.
          //
          // It carried a word for a while and the word decided this. NOW was
          // true wherever the line fell, then Next was a claim about the block
          // underneath — which pushed the line below the running block, because
          // a block you are in the middle of is not the next one. With no word
          // there is nothing to contradict, and the line goes back to marking
          // the edge of the past, which is the division that matters.
          //
          // A day entirely behind or entirely ahead gets no divider, because it
          // would be marking the end of the list rather than a place in the
          // day.
          if (onToday() && !past && !markedNow && i > 0) {
            box.append(nowDivider());
            markedNow = true;
          }

          box.append(blockCard(b, i, { begun, past }));
        }

        $('end-time').textContent = !blocks.length
          ? '—'
          : end >= 1440
            ? `${clock(end)} next day`
            : clock(end);
        $('ends').classList.toggle('late', blocks.length > 0 && end >= 1440);

        // The day on screen no longer matches the day stored, so it is not
        // confirmed however it got that way.
        if (saved && drifted()) saved = false;

        renderConfirm();

        // Which things are in the day has just changed, so which rows are
        // locked has too. Removing a block unlocks its row on this render
        // rather than on the next load.
        renderThings();
      }

      /**
       * Where the past ends: a dot and a rule, and no word.
       *
       * It read NOW, then Next. A word here has to be a claim about one side of
       * the line or the other, and it kept being the wrong one — Next named the
       * block below it, which is not next when that block is already running.
       * A line drawn across the day needs no caption; the blocks on either side
       * of it say which side they are on.
       */
      function nowDivider() {
        const bar = document.createElement('div');
        bar.className = 'now';

        const dot = document.createElement('div');
        dot.className = 'dot';
        const ln = document.createElement('div');
        ln.className = 'ln';

        bar.append(dot, ln);
        return bar;
      }

      // --- what a block can be told to do -------------------------------------

      /**
       * 30m → 1h → … → 4h → 30m.
       *
       * It wraps because there is nothing else to shorten with. A block only
       * grows, and at the ceiling the next press takes it back to the floor —
       * so every length is at most seven presses away and none is a dead end.
       *
       * Floored onto the step first, so a day saved when the grid was
       * fifteen minutes comes back onto it rather than cycling 45, 75, 105 for
       * ever.
       */
      function nextDuration(d) {
        const next = Math.floor(d / STEP) * STEP + STEP;
        return next > MAX_DURATION ? STEP : next;
      }

      /** Where a block dragged `dy` from `from` would land. */
      function targetIndex(from, dy, step, count) {
        const moved = Math.round(dy / step);
        return Math.max(0, Math.min(count - 1, from + moved));
      }

      function cycleDuration(i) {
        if (!blocks[i]) return;

        // A block that has begun has no length left to choose. The chip is not
        // drawn on one — but the drawing is from whenever the page last
        // rendered, and a page open across the start time still holds a live
        // chip on a block that has since begun. So the refusal lives here,
        // where the press lands, rather than only in what was drawn.
        //
        // It re-renders rather than returning quietly: the chip that should not
        // be there goes away, the block says "active", and the press has a
        // visible answer. Doing nothing at all would read as a dead control.
        //
        // The wrap is what makes this more than tidiness. The chip only grows,
        // 30m through 4h and then back to 30m — so on a four-hour block that
        // began an hour ago, one press shortens it to thirty minutes, ending it
        // before the current time and sliding it bodily into the past.
        if (blockBegun(blocks[i])) return renderBuilder();

        blocks[i].duration = nextDuration(blocks[i].duration);
        saved = false;
        renderBuilder();
      }

      // The block whose note is open for writing, or null.
      //
      // While it is set, that block takes no gestures at all: placing a cursor
      // in a note is not handling the block, and a hold that lifted the card
      // out from under the keyboard would be the worst of both.
      let noting = null;

      function openNote(i) {
        if (!blocks[i]) return;
        noting = i;
        renderBuilder();
      }

      /**
       * Saved on the block, not on the entry.
       *
       * "Finish the pricing page" is true of Tuesday morning, not of the
       * project. Writing it onto the entry would make it a claim that outlives
       * the session it describes, and the next block for the same project
       * would inherit a sentence about a different day.
       *
       * Empty is not a note. Clearing the field is how one is removed.
       */
      function saveNote(i, text) {
        noting = null;
        if (!blocks[i]) return renderBuilder();

        const clean = String(text || '').trim();
        const before = blocks[i].note || null;
        blocks[i].note = clean || null;

        if (blocks[i].note !== before) saved = false;
        renderBuilder();
      }

      /**
       * Removed on release, with no confirm.
       *
       * The undo is the safety net, and it is a better one than a confirm: a
       * confirm interrupts every removal to catch the rare wrong one, and this
       * interrupts none of them and still catches it.
       */
      function removeBlock(i) {
        const [gone] = blocks.splice(i, 1);
        if (!gone) return;
        saved = false;
        renderBuilder();
        offerUndo(gone, i);
      }

      let undo = null;

      function clearUndo() {
        if (!undo) return;
        clearTimeout(undo.timer);
        $('undo-host').replaceChildren();
        undo = null;
      }

      function offerUndo(block, index) {
        clearUndo();

        const bar = document.createElement('div');
        bar.className = 'undo';

        const label = document.createElement('span');
        label.textContent = 'Removed ·';

        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Undo';
        button.onclick = () => {
          // Back where it was, unless the day has since got shorter than that.
          blocks.splice(Math.min(index, blocks.length), 0, block);
          saved = false;
          clearUndo();
          renderBuilder();
        };

        bar.append(label, button);
        $('undo-host').replaceChildren(bar);
        undo = { timer: setTimeout(clearUndo, UNDO_MS) };
      }

      // --- one pointer, one gesture -------------------------------------------
      //
      // Four things can happen to a block and they share one finger, so the
      // decision of which is happening is made once, early, and then held to
      // for the rest of the pointer. Nothing re-decides mid-gesture.
      //
      //   tap the duration   cycle it
      //   tap anywhere else  nothing. A block is not a button
      //   hold 400ms         pick it up to reorder. Beats the tap
      //   horizontal past    swipe: left removes, right inserts a buffer
      //   vertical past      the page scrolls, and this takes no further part
      //
      // `touch-action: pan-y` on the card does the hardest part: the browser
      // keeps vertical scrolling for itself and hands us horizontal movement,
      // so a scroll can never become a swipe no matter what this code does.

      let gesture = null;

      // A committed gesture ends with a click on whatever was under the finger.
      // Swallow exactly one, or a swipe that started on the chip would also
      // lengthen the block on its way out.
      let swallowClick = false;

      /**
       * Stop the page scrolling under a block being carried.
       *
       * This is the whole reason reorder used to die the moment you moved.
       * The sequence was: hold fires, the block lifts, the finger moves
       * vertically, `touch-action: pan-y` tells the browser a vertical pan is
       * allowed, the browser takes the gesture, and taking it means firing
       * `pointercancel` — which tore the drag down. From the outside that reads
       * exactly as "the drag stops and scrolling takes over".
       *
       * Three things that look like the fix and are not:
       *
       * - `preventDefault()` on a `pointermove`. Pointer events cannot cancel
       *   a scroll at all, whatever the listener's passivity. Only a touch
       *   event can, which is why the call that used to be here did nothing.
       * - `setPointerCapture`. It routes later events to this element. It does
       *   not stop the browser competing for the gesture, so the drag was
       *   already captured and still lost.
       * - Setting `touch-action` when the hold fires. The value is read when
       *   the pointer goes down and latched for that gesture, so changing it
       *   400ms later does not affect the gesture in flight. It is set below
       *   anyway, because it is correct for anything that starts afterwards
       *   and costs nothing, but it cannot be the mechanism.
       *
       * What does work is a non-passive `touchmove` listener that calls
       * `preventDefault()`. It has to be non-passive or the call is ignored,
       * and it works here specifically because the hold requires the finger to
       * be still: no scroll has begun yet, so there is still one to prevent.
       */
      const blockScroll = (e) => {
        if (e.cancelable) e.preventDefault();
      };

      function holdPage(on) {
        // The suite runs this script against a stub document. Nothing to hold.
        if (typeof document.addEventListener !== 'function') return;
        if (on) document.addEventListener('touchmove', blockScroll, { passive: false });
        else document.removeEventListener('touchmove', blockScroll, { passive: false });
      }

      /** How far the page has scrolled, for a drag to correct against. */
      const pageY = () =>
        (typeof window !== 'undefined' && window.scrollY) || 0;

      function blockCard(b, i, { begun = false, past = false } = {}) {
        const slot = document.createElement('div');
        slot.className = 'slot';

        const backing = document.createElement('div');
        backing.className = 'backing';

        const card = document.createElement('div');
        card.className = past ? 'block past' : 'block';

        const row = document.createElement('div');
        row.className = 'brow';

        const left = document.createElement('div');
        const t = document.createElement('div');
        t.className = 't';
        t.textContent = b.title;
        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = `${clock(b.start)} – ${clock(b.start + b.duration)}`;
        left.append(t, time);

        // A block that has begun carries no length control. A length it can no
        // longer be given is a control that can only mislead, and the server
        // would refuse the change anyway.
        //
        // Running, and it says "active". Over, and it says nothing at all: it
        // used to ask "didn't happen?", and there is no longer any such thing
        // to answer — a block that did not happen is taken out of the day
        // instead. The outline card and the faint title are what mark it as
        // done, and they were always doing that work.
        if (past) {
          row.append(left);
        } else if (begun) {
          row.append(left, activeLabel());
        } else {
          const dur = document.createElement('button');
          dur.type = 'button';
          dur.className = 'dur';
          dur.textContent = span(b.duration);
          dur.setAttribute('aria-label', `${b.title}: ${span(b.duration)}. Press to lengthen.`);

          // The tap lives on click rather than in the pointer handler below,
          // so the keyboard reaches it too: this is a real button and Enter
          // works.
          dur.onclick = () => {
            if (swallowClick) {
              swallowClick = false;
              return;
            }
            cycleDuration(i);
          };

          row.append(left, dur);
        }

        card.append(row);

        // A note says what you are going to do in a block. Once the block is
        // over it is not answering that any more, so it stops being shown —
        // and only shown. The row still holds it, the confirm still sends it,
        // and the message that already went out carried it.
        if (i === noting) card.append(noteEditor(b, i));
        else if (b.note && !past) card.append(noteLine(b.note));

        slot.append(backing, card);

        attach({ slot, card, backing, index: i });
        return slot;
      }

      /**
       * The word on the block you are in. It fills the slot the duration chip
       * left empty, which is the only reason it reads as a label rather than
       * as a control: a gap there looked like something had failed to render.
       *
       * Deliberately not the accent colour. This slot has held a tappable blue
       * pill on every block above it, so blue here would be inviting a press
       * that does nothing.
       */
      function activeLabel() {
        const tag = document.createElement('div');
        tag.className = 'running';
        tag.textContent = 'active';
        return tag;
      }

      function noteLine(text) {
        const note = document.createElement('div');
        note.className = 'note';
        note.textContent = text;
        return note;
      }

      /**
       * The note, open for writing.
       *
       * A textarea rather than an input because it is a line or two and both
       * should be visible. Set up for dictation: capitalised by sentence,
       * spellchecked, and with autocomplete off — a field that guesses at the
       * next word gets in the way of someone talking at it.
       */
      function noteEditor(b, i) {
        const area = document.createElement('textarea');
        area.className = 'noteedit';
        area.rows = 2;
        area.value = b.note || '';
        area.placeholder = 'What are you doing in this block?';
        area.setAttribute('autocapitalize', 'sentences');
        area.setAttribute('autocomplete', 'off');
        area.setAttribute('spellcheck', 'true');
        area.setAttribute('aria-label', `Note for ${b.title}`);

        // Leaving the field is what saves it. There is no button because there
        // is nothing to decide: the text is either there or it is not.
        area.onblur = () => saveNote(i, area.value);

        // Belt and braces with the `noting` guard in the pointer handler: a
        // press inside the field is never a press on the block.
        area.onpointerdown = (e) => {
          if (e && e.stopPropagation) e.stopPropagation();
        };

        setTimeout(() => area.focus(), 0);
        return area;
      }

      function attach({ slot, card, backing, index }) {
        const siblings = () => [...$('builder').children];

        // Asked at the moment of the gesture, not at the moment of the render.
        //
        // The lock used to be a boolean handed in when the card was drawn, and
        // nothing re-renders on a clock tick — so a page left open across a
        // block's start time kept the handlers it was given at 09:59 and let
        // you resize, reorder and annotate a block that had begun at 10:00.
        // The screen said "active" only after the edit, on the render the edit
        // itself triggered.
        //
        // Rendering can go stale; it is a picture of a moment. What must not go
        // stale is what a press is allowed to do, so that question is asked of
        // the clock every time rather than remembered.
        const isBegun = () => blockBegun(blocks[index]);

        const lift = (on) => {
          const still = reduceMotion();
          card.classList.toggle('lifted', on);
          slot.classList.toggle('lifted', on);
          if (on && !still) card.style.transform = 'scale(1.03)';

          for (const other of siblings()) {
            if (other === slot) continue;
            other.classList.toggle('dimmed', on);
            other.style.transition = on && !still ? `transform ${SETTLE_MS}ms ease-out` : '';
            if (!on) other.style.transform = '';
          }
        };

        // The blocks between where it came from and where it is going step out
        // of the way, so the gap it will drop into is visible before release.
        const part = (from, to, step) => {
          siblings().forEach((el, at) => {
            if (at === from) return;
            let shift = 0;
            if (to > from && at > from && at <= to) shift = -step;
            if (to < from && at >= to && at < from) shift = step;
            el.style.transform = shift ? `translateY(${shift}px)` : '';
          });
        };

        const startReorder = () => {
          if (!gesture || gesture.mode !== 'pending') return;
          // A block that has begun cannot be moved. Picking it up would offer
          // a drop the server refuses, and the day it was carried out of has
          // already happened.
          if (isBegun()) return;

          const rect = slot.getBoundingClientRect
            ? slot.getBoundingClientRect()
            : { height: 64 };

          gesture.mode = 'reorder';
          gesture.from = index;
          gesture.to = index;
          gesture.step = (rect.height || 64) + 9;
          // Where the page stood when this began, so a drag stays under the
          // finger even if something scrolls the page out from under it.
          gesture.scroll0 = pageY();
          swallowClick = true;

          // Stop the browser competing for this gesture. The listener is what
          // actually does it; the touch-action is for anything that starts
          // after. See holdPage.
          holdPage(true);
          card.style.touchAction = 'none';

          if (card.setPointerCapture) card.setPointerCapture(gesture.id);
          if (typeof navigator !== 'undefined' && navigator.vibrate) navigator.vibrate(10);
          lift(true);
        };

        // Everything a carried block set, put back. Called on release and on
        // the browser taking the gesture away, because a page left unable to
        // scroll is a worse bug than the one this fixes.
        const releasePage = () => {
          holdPage(false);
          card.style.touchAction = '';
          if (card.releasePointerCapture && gesture && gesture.id !== undefined) {
            try {
              card.releasePointerCapture(gesture.id);
            } catch {
              // Already released, which is fine.
            }
          }
        };

        card.onpointerdown = (e) => {
          // One at a time. A second finger is not a second gesture.
          if (gesture) return;
          if (e.button !== undefined && e.button !== 0) return;
          // A block with its note open is being written in, not handled. No
          // hold, no swipe: placing a cursor must not lift the card out from
          // under the keyboard.
          if (noting === index) return;

          gesture = {
            id: e.pointerId,
            mode: 'pending',
            x0: e.clientX,
            y0: e.clientY,
            dx: 0,
            index,
            card,
            slot,
            backing,
            hold: setTimeout(startReorder, HOLD_MS),
          };
        };

        card.onpointermove = (e) => {
          if (!gesture || gesture.id !== e.pointerId) return;

          // Which way this block can be swiped at all.
          //
          // Left removes, on every block: that is the one rule and the clock
          // does not enter into it. Right writes a note, and only on a block
          // that has not begun — a note says what you are about to do in a
          // block, so it is fixed once the block starts, along with its length
          // and its place in the day.
          //
          // Clamped rather than refused on release. Letting the card follow
          // the finger the whole way and then doing nothing would be offering
          // an action and taking it back.
          const raw = e.clientX - gesture.x0;
          const dx = isBegun() ? Math.min(0, raw) : raw;
          const dy = e.clientY - gesture.y0;

          // Which gesture this is gets decided on the RAW movement, never the
          // clamped one. A finger dragging left on a sent block has moved, and
          // reading it as stillness would leave the hold timer running and turn
          // a refused swipe into a pick-up.
          if (gesture.mode === 'pending') {
            if (Math.abs(raw) < SLOP && Math.abs(dy) < SLOP) return;

            // Moved, so this is not a hold.
            clearTimeout(gesture.hold);

            if (Math.abs(dy) >= Math.abs(raw)) {
              // Vertical and not held: the page is scrolling. Step out of the
              // way entirely rather than competing with it.
              gesture.mode = 'scroll';
              return;
            }

            gesture.mode = 'swipe';
            swallowClick = true;
            if (card.setPointerCapture) card.setPointerCapture(e.pointerId);
          }

          if (gesture.mode === 'swipe') {
            gesture.dx = dx;

            // Nowhere to go: the note swipe on a block that has begun. Nothing
            // moves and no backing is shown, so the action is not offered
            // rather than offered and then refused.
            if (!dx) {
              card.style.transform = '';
              backing.style.opacity = '0';
              return;
            }

            card.style.transform = `translateX(${dx}px)`;

            // Two things, and which one is the direction — never the clock.
            // Left used to mean "didn't happen" on a block that had begun and
            // "Remove" on one that had not, so the label had to be worked out
            // from the time before the finger came off. It is one rule now.
            //
            // The word is the whole difference. There was a loudness here too,
            // and the removing side wore the warn colour across the entire
            // card; the undo is the safety net for a removal, not the colour.
            const [side, label] = dx > 0 ? ['right', 'Note'] : ['left', 'Remove'];

            backing.className = `backing ${side}`;
            backing.textContent = label;
            // Fades in with the travel, so the label arrives before the commit
            // does and the action is readable before release.
            backing.style.opacity = String(Math.min(1, Math.abs(dx) / SWIPE_COMMIT));
            return;
          }

          if (gesture.mode === 'reorder') {
            // Read against where the page is now, not where it was when the
            // hold fired. holdPage should mean this never differs, and if it
            // ever does the block must stay under the finger rather than
            // drifting by however far the page moved.
            const carried = dy + (pageY() - gesture.scroll0);

            card.style.transform =
              `translateY(${carried}px)` + (reduceMotion() ? '' : ' scale(1.03)');

            const to = targetIndex(gesture.from, carried, gesture.step, blocks.length);
            if (to !== gesture.to) {
              gesture.to = to;
              part(gesture.from, to, gesture.step);
            }
          }
        };

        card.onpointerup = (e) => {
          if (!gesture || gesture.id !== e.pointerId) return;
          clearTimeout(gesture.hold);

          const { mode, dx, from, to, step } = gesture;
          gesture = null;

          // A tap. Only the chip does anything with one, and it does it on
          // click, which has already fired or is about to.
          if (mode === 'pending' || mode === 'scroll') return;

          if (mode === 'swipe') {
            // Any block, whatever the clock says. Taking it out of the day is
            // how you say it did not happen.
            if (dx <= -SWIPE_COMMIT) return removeBlock(index);
            // Opens whether or not there is one already, so swiping a block
            // that has a note is how you edit it.
            if (dx >= SWIPE_COMMIT) return openNote(index);

            // Short of it. Settle back and leave the day alone.
            if (!reduceMotion()) card.style.transition = `transform ${SETTLE_MS}ms ease-out`;
            card.style.transform = '';
            backing.style.opacity = '0';
            setTimeout(() => {
              card.style.transition = '';
            }, SETTLE_MS);
            return;
          }

          if (mode === 'reorder') {
            // Before the settle, not after: the page must be scrollable again
            // the moment the finger is off, however long the animation runs.
            releasePage();

            const settle = () => {
              lift(false);
              if (from !== to) {
                const [moved] = blocks.splice(from, 1);
                blocks.splice(to, 0, moved);
                saved = false;
              }
              // A full re-render, which is also what clears every inline
              // transform this gesture left behind.
              renderBuilder();
            };

            if (reduceMotion()) return settle();

            // Ride to the slot it is landing in rather than snapping there.
            card.style.transition = `transform ${SETTLE_MS}ms ease-out`;
            card.style.transform = `translateY(${(to - from) * step}px)`;
            setTimeout(settle, SETTLE_MS);
          }
        };

        // The browser taking the gesture, a call arriving, the pointer leaving
        // the screen. This used to be how a reorder died: `touch-action:
        // pan-y` let the browser claim the drag as a scroll, and claiming it
        // means firing this. With holdPage installed it should no longer be
        // reachable mid-reorder, but it has to leave the page usable if it is.
        card.onpointercancel = () => {
          if (!gesture) return;
          clearTimeout(gesture.hold);
          releasePage();
          gesture = null;
          lift(false);
          card.style.transform = '';
          backing.style.opacity = '0';
        };
      }

      $('add-block').onclick = () => {
        const title = prompt('What is this block?');
        if (title && title.trim()) addBlock({ title: title.trim(), duration: STEP });
      };

      function renderConfirm() {
        const button = $('confirm');
        button.textContent = saved ? 'Confirmed' : 'Confirm';
        button.disabled = saved || !blocks.length;
      }

      $('confirm').onclick = async () => {
        if (!blocks.length) return;
        reflow();

        let res;
        try {
          res = await (
            await fetch('/plan', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                date: planDate(),
                wake_minutes: wake,
                blocks: blocks.map((b) => ({
                  // Null on anything built in this session. The server reads
                  // that as "new" and inserts it; everything else it updates
                  // in place, which is what keeps a delivered block delivered.
                  id: b.id || null,
                  title: b.title,
                  entryId: b.entryId,
                  start_minutes: b.start,
                  duration_minutes: b.duration,
                  note: b.note || null,
                })),
              }),
            })
          ).json();
        } catch (err) {
          alert(`Could not save: ${err.message}`);
          return;
        }

        if (res.error) {
          alert(res.error);
          return;
        }

        // The ids of the day as it now stands, so a second confirm in the same
        // session says which block is which. Without this the blocks built
        // here would still have no id on the next confirm, and the server
        // would drop and re-insert every one of them — the same bug this
        // exists to fix, reached a different way.
        if (Array.isArray(res.ids)) {
          res.ids.forEach((id, i) => {
            if (blocks[i]) blocks[i].id = id;
          });
        }

        // What is stored is now what is on screen, so nothing has drifted.
        // Without this a confirmed day would immediately read as unconfirmed
        // again, because every block it had just moved still remembered the
        // hour it used to be at.
        for (const b of blocks) b.storedStart = b.start;

        // The day is committed, and so is anything removed on the way to it.
        // A pending undo would put back a block holding the id of a row this
        // confirm has just deleted, and the next confirm would be refused for
        // naming an id the plan does not have.
        clearUndo();

        setSaved(true);
      };

      // --- the add sheet -------------------------------------------------------

      let formType = 'task';
      let formFreq = null;
      let formSize = null;

      // The id being edited, or null when adding. The sheet is one sheet: the
      // fields and the rules between them are identical either way, and two
      // copies of that form would be two places for the rules to drift.
      let editingId = null;

      function chooser(box, values, current, pick) {
        box.replaceChildren();
        for (const v of values) {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = v;
          b.setAttribute('aria-pressed', String(v === current));
          b.onclick = () => pick(v);
          box.append(b);
        }
      }

      /**
       * Which fields this type has.
       *
       * The size only appears once there is a due date, because a size with no
       * deadline to be measured against has nothing to say. That is the same
       * rule the server enforces; it is here so the field is never asked for
       * when it is not wanted.
       */
      function renderForm() {
        for (const b of $('type-seg').children) {
          b.setAttribute('aria-pressed', String(b.dataset.type === formType));
          // The type is fixed once set, and the server refuses to change it.
          // Offering the choice on an edit would be offering something that
          // cannot happen.
          b.disabled = editingId !== null;
        }
        $('type-seg').classList.toggle('fixed', editingId !== null);

        const dated = DATED.includes(formType);
        const hasDue = Boolean($('f-due').value);

        $('f-freq-field').classList.toggle('hidden', formType !== 'habit');
        $('f-due-field').classList.toggle('hidden', !dated);
        $('f-size-field').classList.toggle('hidden', !dated || !hasDue);

        chooser($('freq-seg'), FREQUENCIES, formFreq, (v) => {
          formFreq = v;
          renderForm();
        });
        chooser($('size-seg'), SIZES, formSize, (v) => {
          formSize = v;
          renderForm();
        });
      }

      for (const b of $('type-seg').children) {
        b.onclick = () => {
          formType = b.dataset.type;
          renderForm();
        };
      }

      $('f-due').onchange = renderForm;

      /** Adding when called with nothing, editing when called with a row. */
      function openSheet(item) {
        editingId = item ? item.id : null;

        formType = item ? item.type : 'task';
        formFreq = item ? item.frequency : null;
        formSize = item ? item.size : null;
        $('f-title').value = item ? item.title : '';
        $('f-due').value = item && item.due ? item.due : '';

        $('sheet-title').textContent = item ? 'Edit' : 'Add';
        $('add-save').textContent = item ? 'Save' : 'Add';

        $('f-problem').classList.add('hidden');
        renderForm();
        $('add-scrim').classList.remove('hidden');
        $('f-title').focus();
      }

      const closeSheet = () => {
        editingId = null;
        $('add-scrim').classList.add('hidden');
      };

      $('add-open').onclick = () => openSheet();
      $('add-cancel').onclick = closeSheet;
      $('add-scrim').onclick = (e) => {
        if (e.target === $('add-scrim')) closeSheet();
      };

      $('add-save').onclick = async () => {
        const problem = $('f-problem');
        const body = { type: formType, title: $('f-title').value.trim() };

        if (formType === 'habit') body.frequency = formFreq;
        if (DATED.includes(formType)) {
          body.due = $('f-due').value || '';
          // Sent even when empty, so clearing the date clears the size with
          // it rather than leaving a size behind with nothing to measure
          // against. The server applies the same rule to the merged row.
          body.size = body.due ? formSize : '';
        }

        const url = editingId ? `/entries/${editingId}/update` : '/entries';

        let res;
        try {
          res = await (
            await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            })
          ).json();
        } catch (err) {
          res = { error: err.message };
        }

        if (res.error) {
          problem.textContent = res.error;
          problem.classList.remove('hidden');
          return;
        }

        closeSheet();
        await load();
      };

      load();
    </script>
  </body>
</html>
