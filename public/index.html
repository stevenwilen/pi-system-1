<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#fdf8f1" />
    <title>Personal Intelligence</title>

    <link rel="manifest" href="/manifest.json" />

    <!-- iOS ignores the manifest for installation, so these carry the same
         information again. apple-touch-icon is the home screen icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Personal Intelligence" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      :root {
        /* Taken from the mascot. Coral is the brand; everything else is
           built around it. */
        --coral: #ff7a66;
        --coral-deep: #e85b45;
        --blush: #ffb4a3;
        --bg: #fff3ec;
        --surface: #ffffff;
        --sunk: #fce4da;
        --line: #f7ded3;

        /* One warm near-black for every piece of text. The dim variant is
           the same ink at lower opacity, so nothing turns grey. */
        --text: #2b2118;
        --muted: rgba(43, 33, 24, 0.55);

        --brand: var(--coral);
        /* Ink, not white: white on coral is about 2.5:1 and unreadable. */
        --brand-text: #2b2118;
        --danger: #c4432c;

        /* Category accents. Used only on chips and badges, never as
           general chrome, so they stay meaningful. */
        --plan: #ffc145;
        --plan-soft: #fff1d2;
        --plan-ink: #7d5a05;
        --habit: #2fb8a8;
        --habit-soft: #d7f4f0;
        --habit-ink: #12665c;
        --focus: #9b7be8;
        --focus-soft: #ede5fd;
        --focus-ink: #55399b;
        --task: #4a90d9;
        --task-soft: #dfecf9;
        --task-ink: #1f5b92;
        --idea: #e8a33d;
        --idea-soft: #fdeed6;
        --idea-ink: #8a5a06;
        --primary: #ff7a66;
        --primary-soft: #ffe4dc;
        --primary-ink: #a83a26;
        --quiet: #c3b3a1;
        --quiet-soft: #f4ece2;
        --quiet-ink: #6b5f52;

        --shadow-sm: 0 1px 2px rgba(120, 63, 45, 0.07);
        --shadow: 0 1px 2px rgba(120, 63, 45, 0.06),
          0 6px 16px rgba(120, 63, 45, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        /* ui-rounded resolves to SF Pro Rounded on iPhone, which is where the
           friendliness actually comes from. */
        font: 15px/1.5 ui-rounded, "SF Pro Rounded", -apple-system,
          BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI", Roboto,
          system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        /* dvh keeps the composer above the mobile keyboard */
        height: 100dvh;
        overscroll-behavior: none;
        /* kills the double-tap-to-zoom gesture and its 300ms tap delay */
        touch-action: manipulation;
      }

      header {
        flex: none;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 12px 18px 9px;
        padding-top: max(12px, env(safe-area-inset-top));
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
        background: var(--bg);
      }

      .header-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* Deliberately quiet: no fill, muted, and it only takes on weight
         while pressed. */
      .iconbtn {
        width: 30px;
        height: 30px;
        padding: 0;
        border: 0;
        border-radius: 10px;
        background: none;
        color: var(--muted);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: color 0.12s ease, background 0.12s ease;
      }

      .iconbtn svg {
        width: 18px;
        height: 18px;
      }

      .iconbtn:active {
        background: var(--sunk);
        color: var(--text);
      }

      /* --- the overview sheet --- */

      #sheet {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: var(--bg);
        display: flex;
        flex-direction: column;
      }

      #sheet header {
        border-bottom: 1px solid var(--line);
      }

      #sheet-body {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 14px 16px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* A group holds a heading and any number of cards, so it needs its own
         gap. Without it, two projects sit flush against each other. */
      .group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .group h4 {
        margin: 0;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
        padding-left: 2px;
      }

      .group .card {
        gap: 5px;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .kv {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13.5px;
      }

      .kv span:first-child {
        color: var(--muted);
      }

      /* A row whose rank badge stays put while the title wraps beside it. */
      .rank-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      .rank {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        margin-top: 1px;
        border-radius: 7px;
        font-size: 11.5px;
        font-weight: 700;
        /* Keeps 1 and 10 the same width, so the titles stay aligned. */
        font-variant-numeric: tabular-nums;
        background: var(--focus-soft);
        color: var(--focus-ink);
      }

      .rank.task {
        background: var(--task-soft);
        color: var(--task-ink);
      }

      /* Nothing has been decided yet, so it must not read as a rank. */
      .rank.none {
        background: transparent;
        color: var(--muted);
        box-shadow: inset 0 0 0 1.5px var(--line);
      }

      /* Declared last on purpose: for the top task both .task and .top match
         with equal specificity, so this has to be the one that wins. */
      .rank.top {
        background: var(--coral-deep);
        color: #fff;
      }

      .pill {
        align-self: flex-start;
        font-size: 11px;
        font-weight: 650;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--habit-soft);
        color: var(--habit-ink);
      }

      /* Sits inline after a task title rather than on its own line. */
      .pill.due {
        align-self: auto;
        margin-left: 6px;
        background: var(--task-soft);
        color: var(--task-ink);
        white-space: nowrap;
      }

      /* Overdue is the one state worth looking different, so it borrows the
         deep coral rather than a category colour. */
      .pill.due.late {
        background: var(--coral-deep);
        color: #fff;
      }

      .none {
        font-size: 13px;
        color: var(--muted);
        padding-left: 2px;
      }

      nav.tabs {
        flex: none;
        padding: 0 14px 9px;
        background: var(--bg);
      }

      .segmented {
        display: flex;
        gap: 3px;
        padding: 3px;
        background: var(--sunk);
        border-radius: 999px;
      }

      .tab {
        flex: 1;
        padding: 8px 6px;
        border: 0;
        border-radius: 999px;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .tab[aria-selected='true'] {
        background: var(--coral);
        color: var(--text);
        box-shadow: 0 1px 3px rgba(232, 91, 69, 0.35);
      }

      .hidden {
        display: none !important;
      }

      /* --- what I've noticed --- */

      #noticed {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .card {
        background: var(--surface);
        border-radius: 18px;
        padding: 14px 15px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        box-shadow: var(--shadow);
      }

      .card-text {
        font-size: 14.5px;
        font-weight: 600;
        letter-spacing: -0.005em;
      }

      .card-text,
      .card-evidence {
        overflow-wrap: anywhere;
      }

      .card-evidence {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.4;
      }

      .dots {
        display: inline-flex;
        gap: 3px;
        vertical-align: middle;
        margin-right: 4px;
      }

      .dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.25;
      }

      .dots span.on {
        opacity: 0.9;
      }

      .meta-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .meta-row .card-evidence {
        flex: 1;
        /* lets long evidence wrap instead of pushing the button off */
        min-width: 0;
      }

      .meta-row .linkbtn {
        flex: none;
      }

      .card-actions,
      .confirm {
        display: flex;
        gap: 2px;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .confirm .question {
        margin-right: auto;
        font-size: 13px;
        color: var(--muted);
      }

      .linkbtn {
        border: 0;
        background: var(--sunk);
        color: var(--text);
        font: inherit;
        font-size: 12.5px;
        font-weight: 650;
        padding: 6px 13px;
        border-radius: 999px;
        cursor: pointer;
      }

      .linkbtn:active {
        filter: brightness(0.96);
      }

      .linkbtn.quiet {
        background: none;
        color: var(--muted);
      }

      /* Plain text, no pill. The tint appears only while pressed, so there is
         still feedback without a resting shape. */
      .linkbtn.danger {
        background: none;
        color: var(--danger);
      }

      .linkbtn.danger:active {
        background: #fdeae5;
      }

      .linkbtn:disabled {
        opacity: 0.45;
      }

      .removed {
        font-size: 14px;
        color: var(--muted);
      }

      /* --- usage --- */

      #usage {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .panel {
        background: var(--surface);
        border-radius: 18px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: var(--shadow);
      }

      .headline {
        font-size: 27px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .headline small {
        font-size: 15px;
        font-weight: 400;
        color: var(--muted);
      }

      .meter {
        height: 9px;
        border-radius: 999px;
        background: var(--sunk);
        overflow: hidden;
      }

      .meter div {
        height: 100%;
        border-radius: 999px;
        background: var(--habit);
      }

      .meter.low div {
        background: var(--danger);
      }

      .rows {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 15px;
      }

      .row span:first-child {
        color: var(--muted);
      }

      .row.total {
        border-top: 1px solid var(--line);
        padding-top: 8px;
        font-weight: 600;
      }

      .row.total span:first-child {
        color: var(--text);
      }

      .panel h3 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .footnote {
        font-size: 13px;
        color: var(--muted);
        padding: 0 2px;
      }

      #log {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 4px 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }

      .msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 20px;
        font-size: 14.5px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .msg.me {
        align-self: flex-end;
        background: var(--brand);
        color: var(--brand-text);
        border-bottom-right-radius: 7px;
      }

      .msg.brain {
        align-self: flex-start;
        background: var(--blush);
        border-bottom-left-radius: 7px;
      }

      /* The waiting bubble is just the mascot, with no fill behind it. */
      .msg.thinking {
        background: none;
        padding: 2px 0;
      }

      .msg.thinking img {
        width: 32px;
        height: 29px;
        display: block;
        animation: bob 1.7s ease-in-out infinite;
      }

      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(-1.5deg);
        }
        50% {
          transform: translateY(-5px) rotate(1.5deg);
        }
      }

      .msg.error {
        align-self: flex-start;
        background: #fff2ee;
        color: var(--danger);
        border-bottom-left-radius: 7px;
        font-size: 13.5px;
      }

      .msg code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.88em;
        background: rgba(70, 52, 38, 0.08);
        padding: 1px 5px;
        border-radius: 6px;
      }

      .msg.me code {
        background: rgba(255, 255, 255, 0.22);
      }

      .empty {
        margin: auto;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
        padding: 0 24px;
      }

      /* --- welcome, shown only on an empty chat --- */

      #welcome {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 2px 0;
        max-width: 520px;
      }

      .welcome-mascot {
        width: 80px;
        height: 72px;
        align-self: center;
        margin-bottom: -2px;
      }

      #welcome p {
        margin: 0;
      }

      .welcome-lead {
        font-size: 14.5px;
        font-weight: 650;
        letter-spacing: -0.01em;
        text-align: center;
        padding: 0 2px;
      }

      .welcome-card {
        padding: 14px 15px;
        display: flex;
        flex-direction: column;
        gap: 9px;
        background: var(--surface);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }

      .welcome-card p {
        margin: 0;
        font-size: 13px;
        line-height: 1.48;
      }

      /* Three steps, each an icon in its own fixed column so the sentences
         line up down the left edge however wide the emoji renders. */
      .step {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .step-icon {
        flex: none;
        width: 21px;
        font-size: 16px;
        line-height: 1.2;
        text-align: center;
      }

      .welcome-card .quiet-line {
        font-size: 12px;
        color: var(--muted);
        padding-top: 2px;
        border-top: 1px solid var(--line);
        margin-top: 2px;
      }

      .welcome-cta {
        font-size: 12.5px;
        font-weight: 650;
        color: var(--muted);
        padding: 0 2px;
      }

      .chips {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      /* Each chip wears its category's colour, so tapping one is also the
         first lesson in what the colours mean.
         The three values are set per chip in JS from the category name, so
         adding a category needs a palette entry and one line in CATEGORIES,
         never another rule here. */
      .chip {
        border: 0;
        text-align: left;
        font: inherit;
        font-size: 13.5px;
        font-weight: 650;
        padding: 11px 14px;
        border-radius: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--chip-soft, var(--sunk));
        color: var(--chip-ink, var(--text));
        transition: transform 0.12s ease, filter 0.12s ease;
      }

      .chip::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        background: var(--chip, var(--muted));
      }

      .chip:active {
        transform: scale(0.985);
        filter: brightness(0.97);
      }

      @media (prefers-reduced-motion: reduce) {
        .msg.thinking img {
          animation: none;
        }

        .chip:active,
        #send:active {
          transform: none;
        }
      }

      form {
        flex: none;
        display: flex;
        gap: 8px;
        padding: 9px 12px;
        padding-bottom: max(9px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: var(--bg);
      }

      textarea {
        flex: 1;
        resize: none;
        max-height: 140px;
        padding: 11px 15px;
        border: 0;
        border-radius: 20px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        /* 16px keeps iOS Safari from zooming on focus */
        font-size: 16px;
        box-shadow: var(--shadow-sm);
      }

      textarea::placeholder {
        color: var(--muted);
      }

      textarea:focus {
        outline: 2px solid var(--brand);
        outline-offset: 0;
      }

      /* Scoped to the send button on purpose. A bare `button` rule would
         also hit the tabs, the chips and the card actions. */
      /* A rounded square rather than a circle, so it sits with the squared
         corners of the bubbles and cards instead of against them. */
      #send {
        flex: none;
        align-self: flex-end;
        width: 42px;
        height: 42px;
        padding: 0;
        border: 0;
        border-radius: 13px;
        background: var(--coral);
        color: var(--brand-text);
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 2px 9px rgba(232, 91, 69, 0.3);
        transition: transform 0.12s ease, background 0.12s ease;
      }

      #send svg {
        width: 20px;
        height: 20px;
      }

      #send:active {
        transform: scale(0.97);
        background: var(--coral-deep);
      }

      #send:disabled {
        opacity: 0.45;
        cursor: default;
        box-shadow: none;
      }
    </style>
  </head>

  <body>
    <header>
      Personal Intelligence
      <div class="header-actions" id="header-actions"></div>
    </header>

    <nav class="tabs" role="tablist">
      <div class="segmented">
        <button class="tab" id="tab-chat" role="tab" aria-selected="true">
          Chat
        </button>
        <button class="tab" id="tab-noticed" role="tab" aria-selected="false">
          Noticed
        </button>
        <button class="tab" id="tab-usage" role="tab" aria-selected="false">
          Usage
        </button>
      </div>
    </nav>

    <div id="log"></div>

    <div id="noticed" class="hidden"></div>

    <div id="usage" class="hidden"></div>

    <div id="sheet" class="hidden">
      <header>
        Everything I know
        <div class="header-actions">
          <button class="iconbtn" id="sheet-close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
      </header>
      <div id="sheet-body"></div>
    </div>

    <form id="composer">
      <textarea
        id="input"
        rows="1"
        placeholder="Message"
        autocomplete="off"
      ></textarea>
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 20V6M12 6l-6.5 6.5M12 6l6.5 6.5"
            fill="none"
            stroke="currentColor"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </form>

    <script>
      const USER_ID = '00000000-0000-0000-0000-000000000001';

      // Lock zoom. iOS Safari ignores user-scalable=no on ordinary pages, so
      // the pinch gestures have to be cancelled directly. touch-action in the
      // stylesheet handles double-tap.
      for (const type of ['gesturestart', 'gesturechange', 'gestureend']) {
        document.addEventListener(type, (e) => e.preventDefault(), {
          passive: false,
        });
      }

      const log = document.getElementById('log');
      const form = document.getElementById('composer');
      const input = document.getElementById('input');
      const send = document.getElementById('send');

      // Escape first, then apply a very small subset of markdown. The brain
      // writes **bold**, *italic* and `code`, and raw asterisks read badly.
      function render(text) {
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      }

      function atBottom() {
        return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
      }

      function bubble(who, text) {
        document.getElementById('welcome')?.remove();
        log.querySelector('.empty')?.remove();
        const stick = atBottom();

        const el = document.createElement('div');
        el.className = `msg ${who}`;
        if (text === null) {
          // Waiting on /chat takes 10 to 20 seconds, so the mascot bobs
          // rather than the page sitting still.
          el.classList.add('thinking');
          el.innerHTML =
            '<img src="/mascot.svg" alt="Thinking" role="img">';
        } else {
          el.innerHTML = render(text);
        }

        log.appendChild(el);
        if (stick || who === 'me') el.scrollIntoView({ block: 'end' });
        return el;
      }

      function autogrow() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      }

      input.addEventListener('input', autogrow);

      // Enter sends, Shift+Enter makes a new line.
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const message = input.value.trim();
        if (!message || send.disabled) return;

        bubble('me', message);
        input.value = '';
        autogrow();

        send.disabled = true;
        const pending = bubble('brain', null);

        try {
          const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: USER_ID, message }),
          });

          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `server said ${res.status}`);

          // Drop the mascot styling before the bubble becomes a real reply.
          pending.classList.remove('thinking');
          pending.innerHTML = render(data.reply || '(no reply)');
        } catch (err) {
          pending.className = 'msg error';
          pending.textContent = err.message;
        } finally {
          send.disabled = false;
          if (atBottom()) pending.scrollIntoView({ block: 'end' });
          input.focus();
        }
      });

      // --- welcome ----------------------------------------------------------

      // The categories, in the order they appear as chips. `kind` must match
      // a palette trio in the stylesheet: --<kind>, --<kind>-soft and
      // --<kind>-ink. Adding a category is one line here plus those three
      // values; no new CSS rule is needed.
      // Openers, not commands. The old list named one category per chip,
      // which framed the system as five forms to fill in.
      const CATEGORIES = [
        { kind: 'primary', text: 'Get to know me' },
        { kind: 'plan', text: 'Help me plan tomorrow' },
        { kind: 'quiet', text: 'What do you know about me?' },
      ];

      function renderWelcome() {
        if (document.getElementById('welcome')) return;

        const el = document.createElement('div');
        el.id = 'welcome';
        el.innerHTML = `
          <img class="welcome-mascot" src="/mascot.svg" alt="" aria-hidden="true">
          <p class="welcome-lead">I'm your personal intelligence system.</p>
          <div class="welcome-card">
            <div class="step">
              <span class="step-icon" aria-hidden="true">&#128172;</span>
              <p><strong>Tell me anything.</strong> Projects, habits, tasks, ideas, people you're waiting on. Just talk, there's nothing to file.</p>
            </div>
            <div class="step">
              <span class="step-icon" aria-hidden="true">&#129504;</span>
              <p><strong>I learn, you confirm.</strong> I notice how your life actually runs, and check with you before I save anything.</p>
            </div>
            <div class="step">
              <span class="step-icon" aria-hidden="true">&#128276;</span>
              <p><strong>I come back to you.</strong> Your day each morning on Telegram, then a different check-in through the week.</p>
            </div>
            <p class="quiet-line">Nothing is hidden. Tap &#9432; to see everything I hold, and delete what you like.</p>
          </div>
          <p class="welcome-cta">Just talk to me. Start anywhere.</p>
        `;

        const chips = document.createElement('div');
        chips.className = 'chips';

        for (const { text, kind } of CATEGORIES) {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'chip';
          chip.style.setProperty('--chip', `var(--${kind})`);
          chip.style.setProperty('--chip-soft', `var(--${kind}-soft)`);
          chip.style.setProperty('--chip-ink', `var(--${kind}-ink)`);
          chip.textContent = text;
          // Behaves exactly as if it had been typed.
          chip.onclick = () => {
            input.value = text;
            autogrow();
            form.requestSubmit();
          };
          chips.appendChild(chip);
        }

        el.appendChild(chips);
        log.appendChild(el);
      }

      // Empty chat, so introduce yourself. bubble() tears this down as soon as
      // the first message goes out.
      //
      // The test is the log's own contents. There is no history array on this
      // page — `history` here would resolve to window.history, whose length is
      // never 0, so the welcome would never appear.
      if (log.children.length === 0) renderWelcome();

      // --- header buttons ---------------------------------------------------

      const headerActions = document.getElementById('header-actions');

      const OVERVIEW_ICON =
        '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" ' +
        'stroke="currentColor" stroke-width="2" stroke-linecap="round">' +
        '<circle cx="12" cy="12" r="9"/>' +
        '<path d="M12 11.4v4.4"/>' +
        '<path d="M12 7.9v.15"/>' +
        '</svg>';

      const overviewBtn = document.createElement('button');
      overviewBtn.className = 'iconbtn';
      overviewBtn.type = 'button';
      overviewBtn.setAttribute('aria-label', 'Everything I know');
      overviewBtn.innerHTML = OVERVIEW_ICON;
      overviewBtn.onclick = openOverview;
      headerActions.appendChild(overviewBtn);

      // --- everything I know ------------------------------------------------

      const sheet = document.getElementById('sheet');
      const sheetBody = document.getElementById('sheet-body');
      document.getElementById('sheet-close').onclick = () =>
        sheet.classList.add('hidden');

      function group(title) {
        const g = document.createElement('div');
        g.className = 'group';
        const h = document.createElement('h4');
        h.textContent = title;
        g.appendChild(h);
        return g;
      }

      function card() {
        const c = document.createElement('div');
        c.className = 'card';
        return c;
      }

      function line(label, value) {
        const el = document.createElement('div');
        el.className = 'kv';
        const a = document.createElement('span');
        a.textContent = label;
        const b = document.createElement('span');
        b.textContent = value;
        el.append(a, b);
        return el;
      }

      function nothing(text) {
        const el = document.createElement('div');
        el.className = 'none';
        el.textContent = text;
        return el;
      }

      async function openOverview() {
        sheet.classList.remove('hidden');
        sheetBody.innerHTML = '<div class="empty">Loading…</div>';

        let d;
        try {
          const res = await fetch('/overview');
          d = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(d.error || `server said ${res.status}`);
        } catch (err) {
          sheetBody.innerHTML = '';
          const e = document.createElement('div');
          e.className = 'msg error';
          e.textContent = err.message;
          sheetBody.appendChild(e);
          return;
        }

        sheetBody.innerHTML = '';

        // Projects, in the order the brain ranks them.
        const gp = group(`Projects (${d.projects.length})`);
        if (!d.projects.length) gp.appendChild(nothing('None yet.'));
        // Rank and title only. The why and the body both exist for the
        // brain's reasoning, not for reading in a list.
        for (const p of d.projects) {
          const c = card();
          const t = document.createElement('div');
          t.className = 'card-text rank-row';
          t.append(rankBadge(p.priority), document.createTextNode(p.title));
          c.appendChild(t);
          gp.appendChild(c);
        }
        sheetBody.appendChild(gp);

        const gh = group(`Habits (${d.habits.length})`);
        if (!d.habits.length) gh.appendChild(nothing('None yet.'));
        for (const h of d.habits) {
          const c = card();
          const t = document.createElement('div');
          t.className = 'card-text';
          t.textContent = h.title;
          c.appendChild(t);
          if (h.frequency) {
            const f = document.createElement('span');
            f.className = 'pill';
            f.textContent = h.frequency;
            c.appendChild(f);
          }
          gh.appendChild(c);
        }
        sheetBody.appendChild(gh);

        const gt = group(`Open tasks (${d.tasks.length})`);
        if (!d.tasks.length) gt.appendChild(nothing('Nothing outstanding.'));
        if (d.tasks.length) {
          const c = card();
          const s = document.createElement('div');
          s.className = 'stack';
          // Dates are compared in the person's own timezone. Comparing
          // against the browser's idea of today would mark a task overdue
          // several hours early, or late, depending where they are.
          const today = new Intl.DateTimeFormat('en-CA', {
            timeZone: d.profile.timezone,
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
          }).format(new Date());

          const dueLabel = (due) => {
            if (due < today) return 'overdue';
            if (due === today) return 'today';
            const then = new Date(due + 'T12:00:00Z');
            const now = new Date(today + 'T12:00:00Z');
            if (Math.round((then - now) / 86400000) === 1) return 'tomorrow';
            return new Intl.DateTimeFormat('en-GB', {
              timeZone: 'UTC',
              weekday: 'short',
              day: 'numeric',
              month: 'short',
            }).format(then);
          };

          for (const t of d.tasks) {
            const row = document.createElement('div');
            row.className = 'rank-row';
            row.style.fontSize = '13.5px';

            // The due pill sits inside the title span rather than the row, so
            // it follows the end of the text instead of being pushed to a
            // column of its own when the title wraps.
            const title = document.createElement('span');
            title.textContent = t.title;

            if (t.due) {
              const pill = document.createElement('span');
              pill.className = 'pill due' + (t.due < today ? ' late' : '');
              pill.textContent = dueLabel(t.due);
              title.appendChild(pill);
            }

            row.append(rankBadge(t.priority, 'task'), title);
            s.appendChild(row);
          }
          c.appendChild(s);
          gt.appendChild(c);
        }
        sheetBody.appendChild(gt);

        const gw = group(`Waiting on (${d.waiting.length})`);
        if (!d.waiting.length) gw.appendChild(nothing('Not blocked on anything.'));
        if (d.waiting.length) {
          const c = card();
          const s = document.createElement('div');
          s.className = 'stack';
          for (const w of d.waiting) {
            const row = document.createElement('div');
            row.textContent = '• ' + w.title + (w.body ? `: ${w.body}` : '');
            row.style.fontSize = '13.5px';
            s.appendChild(row);
          }
          c.appendChild(s);
          gw.appendChild(c);
        }
        sheetBody.appendChild(gw);

        const gi = group(`Ideas (${d.ideas.length})`);
        if (!d.ideas.length) gi.appendChild(nothing('Nothing captured yet.'));
        if (d.ideas.length) {
          const c = card();
          const s = document.createElement('div');
          s.className = 'stack';
          for (const i of d.ideas) {
            const row = document.createElement('div');
            row.textContent = '• ' + i.title;
            row.style.fontSize = '13.5px';
            s.appendChild(row);
          }
          c.appendChild(s);
          gi.appendChild(c);
        }
        sheetBody.appendChild(gi);

        const gs = group('When I message you');
        const sc = card();
        const stack = document.createElement('div');
        stack.className = 'stack';
        for (const s of d.schedule) stack.appendChild(line(s.label, s.when));
        sc.appendChild(stack);
        gs.appendChild(sc);
        sheetBody.appendChild(gs);

        const gset = group('Settings');
        const setc = card();
        const st = document.createElement('div');
        st.className = 'stack';
        st.append(
          line('Timezone', d.profile.timezone),
          line('Wake time', d.profile.wake_time),
          line('Telegram', d.profile.telegram_linked ? 'linked' : 'not linked')
        );
        setc.appendChild(st);
        gset.appendChild(setc);
        sheetBody.appendChild(gset);
      }

      // --- tabs -------------------------------------------------------------

      const tabChat = document.getElementById('tab-chat');
      const tabNoticed = document.getElementById('tab-noticed');
      const tabUsage = document.getElementById('tab-usage');
      const noticed = document.getElementById('noticed');
      const usage = document.getElementById('usage');

      function showView(which) {
        const views = {
          chat: [tabChat, log],
          noticed: [tabNoticed, noticed],
          usage: [tabUsage, usage],
        };

        for (const [name, [tab, panel]] of Object.entries(views)) {
          const on = name === which;
          tab.setAttribute('aria-selected', String(on));
          panel.classList.toggle('hidden', !on);
        }

        // The composer belongs to the chat only.
        form.classList.toggle('hidden', which !== 'chat');

        if (which === 'noticed') loadObservations();
        if (which === 'usage') loadUsage();
      }

      tabChat.addEventListener('click', () => showView('chat'));
      tabNoticed.addEventListener('click', () => showView('noticed'));
      tabUsage.addEventListener('click', () => showView('usage'));

      // --- usage ------------------------------------------------------------

      const SOURCE_LABELS = {
        chat: 'Chat',
        'day-plan': 'Day plan',
        habits: 'Habits',
        projects: 'Projects',
      };

      // Below a cent, "$0.00" reads as broken. Show what was actually spent.
      function money(n) {
        const v = Number(n) || 0;
        if (v > 0 && v < 0.01) return '<$0.01';
        return `$${v.toFixed(2)}`;
      }

      function panel(title) {
        const el = document.createElement('div');
        el.className = 'panel';
        if (title) {
          const h = document.createElement('h3');
          h.textContent = title;
          el.appendChild(h);
        }
        return el;
      }

      function row(label, value, extraClass) {
        const el = document.createElement('div');
        el.className = extraClass ? `row ${extraClass}` : 'row';
        const l = document.createElement('span');
        l.textContent = label;
        const v = document.createElement('span');
        v.textContent = value;
        el.append(l, v);
        return el;
      }

      async function loadUsage() {
        usage.innerHTML = '<div class="empty">Loading…</div>';

        let data;
        try {
          const res = await fetch('/usage');
          data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `server said ${res.status}`);
        } catch (err) {
          usage.innerHTML = '';
          const e = document.createElement('div');
          e.className = 'msg error';
          e.textContent = err.message;
          usage.appendChild(e);
          return;
        }

        usage.innerHTML = '';

        if (data.calls === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No usage recorded yet.';
          usage.appendChild(empty);
          return;
        }

        // Balance, only when one has been set.
        if (data.balance != null) {
          const p = panel(null);

          const head = document.createElement('div');
          head.className = 'headline';
          head.textContent = money(data.remaining);
          const of = document.createElement('small');
          of.textContent = ` left of ${money(data.balance)}`;
          head.appendChild(of);
          p.appendChild(head);

          const used = Math.min(1, data.spent_since_top_up / data.balance);
          const meter = document.createElement('div');
          meter.className = used > 0.85 ? 'meter low' : 'meter';
          const fill = document.createElement('div');
          fill.style.width = `${Math.max(2, used * 100)}%`;
          meter.appendChild(fill);
          p.appendChild(meter);

          const pct = document.createElement('div');
          pct.className = 'footnote';
          pct.style.padding = '0';
          pct.textContent = `${Math.round(used * 100)}% of this top-up spent`;
          p.appendChild(pct);

          usage.appendChild(p);
        }

        const spend = panel('Spend');
        const rows = document.createElement('div');
        rows.className = 'rows';
        rows.append(
          row('Today', money(data.today)),
          row('This month', money(data.this_month)),
          row('All time', money(data.all_time), 'total')
        );
        spend.appendChild(rows);
        usage.appendChild(spend);

        const sources = Object.entries(data.by_source).sort((a, b) => b[1] - a[1]);
        if (sources.length) {
          const p = panel('Where it went');
          const list = document.createElement('div');
          list.className = 'rows';
          for (const [name, cost] of sources) {
            list.appendChild(row(SOURCE_LABELS[name] || name, money(cost)));
          }
          p.appendChild(list);
          usage.appendChild(p);
        }

        const detail = panel('Tokens');
        const tk = document.createElement('div');
        tk.className = 'rows';
        tk.append(
          row('In', data.input_tokens.toLocaleString()),
          row('Out', data.output_tokens.toLocaleString()),
          row('Model calls', String(data.calls))
        );
        detail.appendChild(tk);
        usage.appendChild(detail);

        const note = document.createElement('div');
        note.className = 'footnote';
        note.textContent = data.balance
          ? 'Estimated from token counts at published rates. Anthropic has no balance endpoint, so this counts down from the figure you set.'
          : 'Estimated from token counts at published rates. Set CREDIT_BALANCE_USD to see a remaining balance.';
        usage.appendChild(note);
      }

      // --- what I've noticed ------------------------------------------------

      // The rank badge for projects and tasks. Number one is the loud one,
      // since knowing what is top matters more at a glance than knowing what
      // is fourth. An unranked row shows an outlined dot: it has to be
      // obviously not a number, or an empty ranking reads as a decided one.
      function rankBadge(priority, kind) {
        const el = document.createElement('span');
        el.className = 'rank';
        if (kind) el.classList.add(kind);

        if (priority) {
          el.textContent = priority;
          if (priority === 1) el.classList.add('top');
          el.title = priority === 1 ? 'Top priority' : `Priority ${priority}`;
        } else {
          el.classList.add('none');
          el.textContent = '·';
          el.title = 'Not ranked yet';
        }
        return el;
      }

      // At or above this, the person said it themselves. Below it, the system
      // worked it out. Kept next to dots() so both readings of confidence
      // stay in one place.
      const STATED_DIRECTLY = 90;

      // Quiet confidence: three dots, nothing numeric on screen.
      function dots(confidence) {
        const n =
          confidence == null ? 2 : confidence <= 40 ? 1 : confidence <= 75 ? 2 : 3;
        const label =
          confidence == null ? 'confidence not recorded' : `confidence ${confidence}`;

        const wrap = document.createElement('span');
        wrap.className = 'dots';
        wrap.title = label;
        wrap.setAttribute('aria-label', label);
        for (let i = 1; i <= 3; i++) {
          const d = document.createElement('span');
          if (i <= n) d.className = 'on';
          wrap.appendChild(d);
        }
        return wrap;
      }

      async function loadObservations() {
        noticed.innerHTML = '<div class="empty">Loading…</div>';
        try {
          const res = await fetch('/observations');
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || `server said ${res.status}`);
          renderObservations(data.observations || []);
        } catch (err) {
          noticed.innerHTML = '';
          const e = document.createElement('div');
          e.className = 'msg error';
          e.textContent = err.message;
          noticed.appendChild(e);
        }
      }

      function renderObservations(list) {
        noticed.innerHTML = '';
        if (list.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = "Nothing noticed yet. I'll fill this in as we talk.";
          noticed.appendChild(empty);
          return;
        }
        for (const o of list) {
          const el = document.createElement('div');
          el.className = 'card';
          paintCard(el, o);
          noticed.appendChild(el);
        }
      }

      // The observation itself, why it was made, and how sure. The body field
      // is deliberately not shown: it is generated detail you cannot act on.
      function paintCard(el, o) {
        el.innerHTML = '';

        const text = document.createElement('div');
        text.className = 'card-text';
        text.textContent = o.title || '';
        el.appendChild(text);

        // Evidence and Delete share a row, the evidence taking whatever width
        // is left and the button pinned to the right.
        const row = document.createElement('div');
        row.className = 'meta-row';

        const meta = document.createElement('div');
        meta.className = 'card-evidence';
        meta.appendChild(dots(o.confidence));

        // Where it came from, not what was said. Confidence carries this
        // because something stated outright is certain by definition, while
        // an inference never is. A missing confidence reads as inferred,
        // which is the claim that cannot be wrong about the person.
        const ev = document.createElement('span');
        ev.textContent =
          (o.confidence || 0) >= STATED_DIRECTLY
            ? 'You told me this'
            : 'I noticed this myself';
        // The evidence is kept as a tooltip rather than dropped, so the record
        // survives without the card carrying it.
        if (o.evidence) ev.title = o.evidence;
        meta.appendChild(ev);

        const delBtn = document.createElement('button');
        delBtn.className = 'linkbtn danger';
        delBtn.textContent = 'Delete';
        delBtn.onclick = () => confirmDelete(el, o);

        row.append(meta, delBtn);
        el.appendChild(row);
      }

      function confirmDelete(el, o) {
        // The whole row becomes the question, so it gets the full width.
        const actions = el.querySelector('.meta-row');
        actions.className = 'confirm';
        actions.innerHTML = '';

        const question = document.createElement('span');
        question.className = 'question';
        question.textContent = 'Delete this?';

        const cancel = document.createElement('button');
        cancel.className = 'linkbtn quiet';
        cancel.textContent = 'Cancel';
        cancel.onclick = () => paintCard(el, o);

        const yes = document.createElement('button');
        yes.className = 'linkbtn danger';
        yes.textContent = 'Delete';
        yes.onclick = async () => {
          yes.disabled = true;
          try {
            const res = await fetch(`/observations/${o.id}/delete`, {
              method: 'POST',
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `server said ${res.status}`);

            el.innerHTML = '';
            const done = document.createElement('div');
            done.className = 'removed';
            done.textContent = 'Removed.';
            el.appendChild(done);

            setTimeout(() => {
              el.style.transition = 'opacity .3s';
              el.style.opacity = '0';
              setTimeout(() => {
                el.remove();
                if (!noticed.querySelector('.card')) renderObservations([]);
              }, 300);
            }, 1300);
          } catch (err) {
            yes.disabled = false;
            question.textContent = err.message;
          }
        };

        actions.append(question, cancel, yes);
      }
    </script>
  </body>
</html>
